_HOSTED_CPU_MODEL_TIMEOUT_SECONDS = 120.0


def _hosted_cpu_wallclock_exempt() -> bool:
    return str(os.getenv(_HOSTED_CPU_WALLCLOCK_ENV) or "").strip().lower() in {
        "1",
        "true",
        "yes",
        "on",
    }


