name: RQ1-C Formal Workflow Blob Uploader

on:
  push:
    branches: [codex/rq1c-bounded-qualification]

permissions:
  contents: write

jobs:
  publish:
    if: "${{ github.event.head_commit.message == 'ci: create validated rq1c formal workflow blob' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/rq1c-bounded-qualification
      - name: Build and validate formal live12 workflow
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/rq1c-live-qualification.yml')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '      RESEARCH_CANDIDATE_ASSESSOR_BASE_URL: http://127.0.0.1:8001/v1\n'
                  '      RESEARCH_CANDIDATE_ASSESSOR_MODEL_NAME: rq1c-qwen25-15b-instruct-q4km\n'
                  '      RESEARCH_CANDIDATE_ASSESSOR_API_KEY: local\n',
                  '      RESEARCH_CANDIDATE_ASSESSOR_BASE_URL: http://127.0.0.1:8000/v1\n'
                  '      RESEARCH_CANDIDATE_ASSESSOR_MODEL_NAME: rq1c-qwen3-4b-instruct-2507-q4km\n'
                  '      RESEARCH_CANDIDATE_ASSESSOR_API_KEY: local\n'
                  "      RQ1C_HOSTED_CPU_WALLCLOCK_EXEMPT: 'true'\n",
              ),
              (
                  "              'candidate_assessor_timeout_seconds': 15,\n",
                  "              'candidate_assessor_product_timeout_seconds': 15,\n"
                  "              'qualification_hosted_cpu_model_timeout_cap_seconds': 120,\n"
                  "              'product_soft_timeout_seconds': 45,\n"
                  "              'product_hard_timeout_seconds': 60,\n"
                  "              'qualification_hosted_cpu_soft_timeout_seconds': 240,\n"
                  "              'qualification_hosted_cpu_hard_timeout_seconds': 300,\n"
                  "              'hosted_cpu_wallclock_exempt': (\n"
                  "                  os.environ.get('RQ1C_HOSTED_CPU_WALLCLOCK_EXEMPT') == 'true'\n"
                  "              ),\n"
                  "              'hosted_cpu_wallclock_exempt_reason': 'github_hosted_local_model_cpu',\n",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one patch anchor, got {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Verify bounded diff and create Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          grep -F "RESEARCH_CANDIDATE_ASSESSOR_BASE_URL: http://127.0.0.1:8000/v1" .github/workflows/rq1c-live-qualification.yml
          grep -F "RESEARCH_CANDIDATE_ASSESSOR_MODEL_NAME: rq1c-qwen3-4b-instruct-2507-q4km" .github/workflows/rq1c-live-qualification.yml
          grep -F "RQ1C_HOSTED_CPU_WALLCLOCK_EXEMPT: 'true'" .github/workflows/rq1c-live-qualification.yml
          git diff --check
          test "$(git diff --name-only)" = ".github/workflows/rq1c-live-qualification.yml"
          git diff --numstat .github/workflows/rq1c-live-qualification.yml | tee rq1c-formal-wiring-numstat.txt
          python - <<'PY' > blob-request.json
          import base64, json
          from pathlib import Path
          data = Path('.github/workflows/rq1c-live-qualification.yml').read_bytes()
          print(json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            --data-binary @blob-request.json > blob-response.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('blob-response.json').read_text())
          sha = str(data.get('sha') or '')
          if len(sha) != 40:
              raise SystemExit(f'invalid blob response: {data}')
          Path('rq1c-formal-workflow-blob-sha.txt').write_text(sha + '\n')
          print(sha)
          PY
      - name: Upload validated blob identity
        uses: actions/upload-artifact@v4
        with:
          name: rq1c-formal-workflow-blob
          path: |
            rq1c-formal-workflow-blob-sha.txt
            rq1c-formal-wiring-numstat.txt
          if-no-files-found: error
          retention-days: 2
