name: RQ1C P16 repair v3 harness

on:
  push:
    branches:
      - codex/rq1c-bounded-qualification

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[rq1c-p16-repair-v3]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/rq1c-bounded-qualification
          fetch-depth: 0

      - name: Repair configured-budget anchor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/rq1c-p16-bounded-fix-v3.yml')
          text = path.read_text(encoding='utf-8')
          old = (
              '                  \\"soft_timeout_seconds\\": 45,\n'
              '                  \\"hard_timeout_seconds\\": 60,\n'
          )
          new = (
              '                      \\"soft_timeout_seconds\\": 45,\n'
              '                      \\"hard_timeout_seconds\\": 60,\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one configured-budget harness anchor, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit repaired v3 and remove repair harness
        run: |
          rm .github/workflows/rq1c-p16-repair-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/rq1c-p16-bounded-fix-v3.yml .github/workflows/rq1c-p16-repair-v3.yml
          git diff --cached --check
          git commit -m "[rq1c-p16-patch-v3] repair configured budget harness anchor"
          git push origin HEAD:codex/rq1c-bounded-qualification
