name: RQ1-C Live14 Safe Classification Patch

on:
  push:
    branches:
      - codex/rq1c-bounded-qualification

permissions:
  contents: write

jobs:
  patch-and-test:
    if: "${{ github.event.head_commit.message == 'chore: stage RQ1-C live14 safe classification' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply diagnostic-only classification patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'patch anchor drifted: {path}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          candidate = 'src/web/research/candidate_assessment.py'
          replace_once(
              candidate,
              '''class CompactAssessmentCodeError(ValueError):\n    """Compact response contains an unknown or malformed enum code."""\n''',
              '''class CompactAssessmentCodeError(ValueError):\n    """Compact response contains an unknown or malformed enum code."""\n\n\nclass CompactAssessmentRelevanceCodeError(CompactAssessmentCodeError):\n    """Compact relevance code is unknown or malformed."""\n\n\nclass CompactAssessmentSourceRoleCodeError(CompactAssessmentCodeError):\n    """Compact source-role code is unknown or malformed."""\n\n\nclass CompactAssessmentGainSignalCodeError(CompactAssessmentCodeError):\n    """Compact gain-signal code is unknown or malformed."""\n\n\nclass CompactAssessmentGainSignalDuplicateError(CompactAssessmentCodeError):\n    """Compact gain-signal list repeats a decoded semantic value."""\n''',
          )
          replace_once(
              candidate,
              '''                "relevance": _compact_code(\n                    raw.get("r"), CANDIDATE_ASSESSMENT_RELEVANCE_CODES, "relevance"\n                ),\n''',
              '''                "relevance": _compact_code(\n                    raw.get("r"),\n                    CANDIDATE_ASSESSMENT_RELEVANCE_CODES,\n                    "relevance",\n                    CompactAssessmentRelevanceCodeError,\n                ),\n''',
          )
          replace_once(
              candidate,
              '''                "source_role": _compact_code(\n                    raw.get("s"),\n                    CANDIDATE_ASSESSMENT_SOURCE_ROLE_CODES,\n                    "source role",\n                ),\n''',
              '''                "source_role": _compact_code(\n                    raw.get("s"),\n                    CANDIDATE_ASSESSMENT_SOURCE_ROLE_CODES,\n                    "source role",\n                    CompactAssessmentSourceRoleCodeError,\n                ),\n''',
          )
          replace_once(
              candidate,
              '''def _compact_code(value: Any, codes: Mapping[int, str], label: str) -> str:\n    if isinstance(value, bool) or not isinstance(value, int) or value not in codes:\n        raise CompactAssessmentCodeError(f"compact {label} code invalid")\n    return codes[value]\n\n\ndef _compact_codes(value: Any, codes: Mapping[int, str]) -> list[str]:\n    if not isinstance(value, list):\n        raise CompactAssessmentCodeError("compact gain signal codes invalid")\n    result: list[str] = []\n    for item in value:\n        decoded = _compact_code(item, codes, "gain signal")\n        if decoded in result:\n            raise CompactAssessmentCodeError("compact gain signal codes duplicate")\n        result.append(decoded)\n    return result\n''',
              '''def _compact_code(\n    value: Any,\n    codes: Mapping[int, str],\n    label: str,\n    error_type: type[CompactAssessmentCodeError] = CompactAssessmentCodeError,\n) -> str:\n    if isinstance(value, bool) or not isinstance(value, int) or value not in codes:\n        raise error_type(f"compact {label} code invalid")\n    return codes[value]\n\n\ndef _compact_codes(value: Any, codes: Mapping[int, str]) -> list[str]:\n    if not isinstance(value, list):\n        raise CompactAssessmentGainSignalCodeError("compact gain signal codes invalid")\n    result: list[str] = []\n    for item in value:\n        decoded = _compact_code(\n            item,\n            codes,\n            "gain signal",\n            CompactAssessmentGainSignalCodeError,\n        )\n        if decoded in result:\n            raise CompactAssessmentGainSignalDuplicateError(\n                "compact gain signal codes duplicate"\n            )\n        result.append(decoded)\n    return result\n''',
          )
          replace_once(
              candidate,
              '''    "CompactAssessmentCoverageError",\n    "CompactAssessmentCodeError",\n    "CompactAssessmentDomainError",\n''',
              '''    "CompactAssessmentCoverageError",\n    "CompactAssessmentCodeError",\n    "CompactAssessmentDomainError",\n    "CompactAssessmentGainSignalCodeError",\n    "CompactAssessmentGainSignalDuplicateError",\n    "CompactAssessmentRelevanceCodeError",\n    "CompactAssessmentSourceRoleCodeError",\n''',
          )

          candidate_test = 'tests/test_research_candidate_assessment.py'
          replace_once(
              candidate_test,
              '''    CompactAssessmentCodeError,\n    build_candidate_assessment_request,\n''',
              '''    CompactAssessmentCodeError,\n    CompactAssessmentGainSignalCodeError,\n    CompactAssessmentGainSignalDuplicateError,\n    CompactAssessmentRelevanceCodeError,\n    CompactAssessmentSourceRoleCodeError,\n    build_candidate_assessment_request,\n''',
          )
          replace_once(
              candidate_test,
              '''def test_compact_parser_classifies_unknown_enum_code() -> None:\n    candidate = _candidate("a")\n    request = build_candidate_assessment_request((candidate,), claim=_claim())\n\n    with pytest.raises(CompactAssessmentCodeError):\n        parse_compact_candidate_assessment_response(\n            {\n                "v": CANDIDATE_ASSESSMENT_WIRE_SCHEMA_VERSION,\n                "a": [{"i": 0, "r": 99, "rc": 0.8, "s": 1, "sc": 0.9, "g": [0]}],\n            },\n            request=request,\n            cluster_assignments={"a": _assignment("a")},\n        )\n''',
              '''@pytest.mark.parametrize(\n    ("field", "value", "error_type"),\n    [\n        ("r", 99, CompactAssessmentRelevanceCodeError),\n        ("s", 99, CompactAssessmentSourceRoleCodeError),\n        ("g", [99], CompactAssessmentGainSignalCodeError),\n        ("g", [0, 0], CompactAssessmentGainSignalDuplicateError),\n    ],\n)\ndef test_compact_parser_classifies_code_failure_domain(\n    field: str,\n    value: object,\n    error_type: type[CompactAssessmentCodeError],\n) -> None:\n    candidate = _candidate("a")\n    request = build_candidate_assessment_request((candidate,), claim=_claim())\n    row = {"i": 0, "r": 0, "rc": 0.8, "s": 1, "sc": 0.9, "g": [0]}\n    row[field] = value\n\n    with pytest.raises(error_type):\n        parse_compact_candidate_assessment_response(\n            {"v": CANDIDATE_ASSESSMENT_WIRE_SCHEMA_VERSION, "a": [row]},\n            request=request,\n            cluster_assignments={"a": _assignment("a")},\n        )\n''',
          )

          diagnostic = 'tools/run_rq1c_preread_diagnostic.py'
          replace_once(
              diagnostic,
              '''from src.repositories.web_lookup_repository import WebLookupRepository  # noqa: E402\nfrom tools.rq1c_git_identity import exact_checkout_git_sha  # noqa: E402\n''',
              '''from src.repositories.web_lookup_repository import WebLookupRepository  # noqa: E402\nfrom src.web.research.active_adapter import ActiveResearchGateway  # noqa: E402\nfrom src.web.research_gateway import ResearchWebGateway  # noqa: E402\nfrom tools.rq1c_git_identity import exact_checkout_git_sha  # noqa: E402\n''',
          )
          replace_once(
              diagnostic,
              '''DEFAULT_OUTPUT = REPO_ROOT / "output" / "rq1c-preread-starvation-diagnostic.json"\n''',
              '''DEFAULT_OUTPUT = REPO_ROOT / "output" / "rq1c-preread-starvation-diagnostic.json"\n_ASSESSOR_FAILURE_CATEGORY_BY_TYPE = {\n    "CompactAssessmentRelevanceCodeError": "compact_code_relevance",\n    "CompactAssessmentSourceRoleCodeError": "compact_code_source_role",\n    "CompactAssessmentGainSignalCodeError": "compact_code_gain_signal",\n    "CompactAssessmentGainSignalDuplicateError": "compact_code_duplicate",\n    "CompactAssessmentCodeError": "compact_code_other",\n    "CompactAssessmentDomainError": "expanded_domain",\n}\n_CANONICAL_READER_PROVIDER_CODES = frozenset(\n    {\n        "blocked",\n        "fetch_failed",\n        "http_error",\n        "http_status",\n        "invalid_url",\n        "not_found",\n        "page_read_failed",\n        "provider_failed",\n        "timeout",\n        "unsupported",\n    }\n)\n''',
          )
          replace_once(
              diagnostic,
              '''def _model_call_rows(runtime: Mapping[str, Any]) -> list[dict[str, Any]]:\n''',
              '''def _canonical_provider_code(value: Any) -> str:\n    label = _bounded(value, 80).casefold().replace("-", "_")\n    if not label:\n        return ""\n    return label if label in _CANONICAL_READER_PROVIDER_CODES else "other"\n\n\nclass _DiagnosticReadGateway:\n    """Observe safe failure classes while preserving the production read result."""\n\n    def __init__(self, inner: Any | None = None) -> None:\n        self._inner = inner if inner is not None else ResearchWebGateway()\n        self._failure_category_counts: dict[str, int] = {}\n        self._provider_code_counts: dict[str, int] = {}\n\n    @staticmethod\n    def _increment(bucket: dict[str, int], key: str) -> None:\n        bucket[key] = bucket.get(key, 0) + 1\n\n    def read(self, url: str, *, max_chars: int = 6000) -> Any:\n        try:\n            result = self._inner.read(url, max_chars=max_chars)\n        except Exception:\n            self._increment(self._failure_category_counts, "exception")\n            raise\n        if not isinstance(result, Mapping):\n            return result\n        content = str(result.get("content") or result.get("readme") or "")\n        if result.get("ok") is True:\n            if not content.strip():\n                self._increment(self._failure_category_counts, "empty_content")\n        else:\n            self._increment(\n                self._failure_category_counts,\n                "gateway_negative_result",\n            )\n            provider_code = _canonical_provider_code(result.get("error_code"))\n            if provider_code:\n                self._increment(self._provider_code_counts, provider_code)\n        return result\n\n    def summary(self) -> dict[str, Any]:\n        return {\n            "failure_category_counts": dict(\n                sorted(self._failure_category_counts.items())\n            ),\n            "provider_code_counts": dict(sorted(self._provider_code_counts.items())),\n            "stores_candidate_identity": False,\n            "stores_failure_detail": False,\n            "stores_page_content": False,\n        }\n\n\ndef _assessor_failure_summary(model_calls: list[dict[str, Any]]) -> dict[str, Any]:\n    counts: dict[str, int] = {}\n    for row in model_calls:\n        if row.get("purpose") != "research_candidate_assessment":\n            continue\n        category = _ASSESSOR_FAILURE_CATEGORY_BY_TYPE.get(str(row.get("error_type") or ""))\n        if category:\n            counts[category] = counts.get(category, 0) + 1\n    return {\n        "failure_category_counts": dict(sorted(counts.items())),\n        "stores_candidate_identity": False,\n        "stores_failure_detail": False,\n    }\n\n\ndef _model_call_rows(runtime: Mapping[str, Any]) -> list[dict[str, Any]]:\n''',
          )
          replace_once(
              diagnostic,
              '''    service: ClaimEngineDispatchWebLookupService,\n    reference_date: str,\n''',
              '''    reference_date: str,\n''',
          )
          replace_once(
              diagnostic,
              '''    error_type = ""\n    try:\n        completed = service.execute(run.id, raise_on_error=False)\n''',
              '''    diagnostic_reader = _DiagnosticReadGateway()\n    service = ClaimEngineDispatchWebLookupService(\n        repository,\n        active_gateway_factory=lambda: ActiveResearchGateway(\n            read_gateway=diagnostic_reader\n        ),\n    )\n    error_type = ""\n    try:\n        completed = service.execute(run.id, raise_on_error=False)\n''',
          )
          replace_once(
              diagnostic,
              '''            "model_call_count": len(model_calls),\n            "model_calls": model_calls,\n            "assessment_summary": _assessment_summary(context),\n            "read_failure_summary": _read_failure_summary(runtime),\n''',
              '''            "model_call_count": len(model_calls),\n            "model_calls": model_calls,\n            "assessment_summary": _assessment_summary(context),\n            "assessor_failure_summary": _assessor_failure_summary(model_calls),\n            "read_failure_summary": _read_failure_summary(runtime),\n            "reader_failure_classification": diagnostic_reader.summary(),\n''',
          )
          replace_once(
              diagnostic,
              '''        service = ClaimEngineDispatchWebLookupService(repository)\n        for case in cases:\n            record = _run_case(\n                case=case,\n                repository=repository,\n                service=service,\n                reference_date=reference_date,\n            )\n''',
              '''        for case in cases:\n            record = _run_case(\n                case=case,\n                repository=repository,\n                reference_date=reference_date,\n            )\n''',
          )

          diagnostic_test = 'tests/test_rq1c_preread_diagnostic.py'
          replace_once(
              diagnostic_test,
              '''from tools.run_rq1c_preread_diagnostic import (\n    _assessment_summary,\n    _read_failure_summary,\n)\n''',
              '''import pytest\n\nfrom tools.run_rq1c_preread_diagnostic import (\n    _DiagnosticReadGateway,\n    _assessment_summary,\n    _assessor_failure_summary,\n    _read_failure_summary,\n)\n''',
          )
          with Path(diagnostic_test).open('a', encoding='utf-8') as handle:
              handle.write(\n                  '''\n\n\ndef test_assessor_failure_summary_splits_safe_compact_domains() -> None:\n    summary = _assessor_failure_summary(\n        [\n            {\n                "purpose": "research_candidate_assessment",\n                "error_type": "CompactAssessmentRelevanceCodeError",\n            },\n            {\n                "purpose": "research_candidate_assessment",\n                "error_type": "CompactAssessmentSourceRoleCodeError",\n            },\n            {\n                "purpose": "research_candidate_assessment",\n                "error_type": "CompactAssessmentGainSignalCodeError",\n            },\n            {\n                "purpose": "research_candidate_assessment",\n                "error_type": "CompactAssessmentGainSignalDuplicateError",\n            },\n            {\n                "purpose": "research_candidate_assessment",\n                "error_type": "CompactAssessmentDomainError",\n            },\n            {\n                "purpose": "research_candidate_assessment",\n                "error_type": "TimeoutError",\n            },\n            {\n                "purpose": "research_evidence_extraction",\n                "error_type": "CompactAssessmentRelevanceCodeError",\n            },\n        ]\n    )\n\n    assert summary == {\n        "failure_category_counts": {\n            "compact_code_duplicate": 1,\n            "compact_code_gain_signal": 1,\n            "compact_code_relevance": 1,\n            "compact_code_source_role": 1,\n            "expanded_domain": 1,\n        },\n        "stores_candidate_identity": False,\n        "stores_failure_detail": False,\n    }\n\n\nclass _ReaderStub:\n    def read(self, url: str, *, max_chars: int = 6000):\n        del max_chars\n        if url.endswith("exception"):\n            raise TimeoutError("private timeout detail")\n        if url.endswith("empty"):\n            return {"ok": True, "content": "   ", "url": "private-empty"}\n        if url.endswith("known-negative"):\n            return {\n                "ok": False,\n                "error": "private upstream detail",\n                "error_code": "timeout",\n                "url": "private-known",\n            }\n        return {\n            "ok": False,\n            "error": "private upstream detail",\n            "error_code": "private-upstream-code",\n            "url": "private-unknown",\n        }\n\n\ndef test_diagnostic_reader_classifies_failures_without_storing_content_or_identity() -> None:\n    reader = _DiagnosticReadGateway(_ReaderStub())\n\n    with pytest.raises(TimeoutError):\n        reader.read("https://secret.example/exception")\n    assert reader.read("https://secret.example/empty")["ok"] is True\n    assert reader.read("https://secret.example/known-negative")["ok"] is False\n    assert reader.read("https://secret.example/unknown-negative")["ok"] is False\n\n    summary = reader.summary()\n    assert summary == {\n        "failure_category_counts": {\n            "empty_content": 1,\n            "exception": 1,\n            "gateway_negative_result": 2,\n        },\n        "provider_code_counts": {"other": 1, "timeout": 1},\n        "stores_candidate_identity": False,\n        "stores_failure_detail": False,\n        "stores_page_content": False,\n    }\n    serialized = str(summary)\n    assert "secret.example" not in serialized\n    assert "private upstream detail" not in serialized\n    assert "private-upstream-code" not in serialized\n'''
              )

          Path('.github/workflows/rq1c-live14-patch.yml').unlink()
          PY
      - name: Focused tests and static checks
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/test_research_candidate_assessment.py tests/test_rq1c_preread_diagnostic.py
          ruff check src/web/research/candidate_assessment.py tools/run_rq1c_preread_diagnostic.py tests/test_research_candidate_assessment.py tests/test_rq1c_preread_diagnostic.py
          python -m py_compile src/web/research/candidate_assessment.py tools/run_rq1c_preread_diagnostic.py
          git diff --check
      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/web/research/candidate_assessment.py tools/run_rq1c_preread_diagnostic.py tests/test_research_candidate_assessment.py tests/test_rq1c_preread_diagnostic.py .github/workflows/rq1c-live14-patch.yml
          git diff --cached --check
          git commit -m "test(research): refine preread safe failure classes"
          git push origin HEAD:${GITHUB_REF_NAME}
