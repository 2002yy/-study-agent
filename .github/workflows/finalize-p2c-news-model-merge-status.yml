name: Finalize P2-C News model merge status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-p2c-news-model-merge-status.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update merged status
        run: python tools/finalize_p2c_news_model_merge_status.py
      - name: Remove temporary patch files and commit
        run: |
          git rm tools/finalize_p2c_news_model_merge_status.py .github/workflows/finalize-p2c-news-model-merge-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md
          git commit -m "docs: mark P2-C News model exit merged"
          git push origin HEAD:main
