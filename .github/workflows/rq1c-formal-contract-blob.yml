name: RQ1-C Formal Contract Blob Uploader

on:
  push:
    branches:
      - codex/rq1c-bounded-qualification

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'ci: apply rq1c formal contract blob' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/rq1c-bounded-qualification
          fetch-depth: 1
      - name: Patch formal workflow to reviewed blob
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/rq1c-live-qualification.yml')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('    timeout-minutes: 45\n', '    timeout-minutes: 90\n'),
              (
                  "              'qualification_hosted_cpu_hard_timeout_seconds': 300,\n"
                  "              'hosted_cpu_wallclock_exempt': (\n",
                  "              'qualification_hosted_cpu_hard_timeout_seconds': 300,\n"
                  "              'qualification_hosted_cpu_case_hard_timeout_seconds': 540,\n"
                  "              'qualification_hosted_cpu_answer_timeout_seconds': 120,\n"
                  "              'hosted_cpu_wallclock_exempt': (\n",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one patch anchor, got {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Verify exact reviewed blob and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          expected_blob=e4aafc0ff715da79f037839478222443311b85e0
          test "$(git diff --name-only)" = ".github/workflows/rq1c-live-qualification.yml"
          actual_blob="$(git hash-object .github/workflows/rq1c-live-qualification.yml)"
          test "$actual_blob" = "$expected_blob"
          test "$(git diff --numstat .github/workflows/rq1c-live-qualification.yml)" = $'3\t1\t.github/workflows/rq1c-live-qualification.yml'
          git diff --check
      - name: Commit exact formal workflow blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/rq1c-live-qualification.yml
          git diff --cached --check
          git commit -m "ci(qualification): align hosted execution allowance"
          git push origin HEAD:codex/rq1c-bounded-qualification
