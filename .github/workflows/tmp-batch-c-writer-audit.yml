name: Temporary Batch C stop writer audit

on:
  push:
    branches:
      - tmp/batch-c-writer-contract-repair

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace WebLookupRun stop-reason producer values
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path('src/application/web_lookup_service.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text)

          print('=== WEB LOOKUP SERVICE reason ASSIGNMENTS ===')
          for node in ast.walk(tree):
              if isinstance(node, (ast.Assign, ast.AnnAssign)):
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  value = node.value
                  if value is None:
                      continue
                  for target in targets:
                      if isinstance(target, ast.Name) and target.id == 'reason':
                          print(f'{node.lineno}\t{ast.unparse(value)}')
              if isinstance(node, ast.IfExp):
                  # Surface literal leaves of conditional stop_reason expressions.
                  pass

          print('=== WEB LOOKUP SERVICE stop_reason KW EXPRESSIONS ===')
          for node in ast.walk(tree):
              if not isinstance(node, ast.Call):
                  continue
              func = node.func.attr if isinstance(node.func, ast.Attribute) else (
                  node.func.id if isinstance(node.func, ast.Name) else ''
              )
              if func not in {'complete', 'fail', 'checkpoint'}:
                  continue
              for kw in node.keywords:
                  if kw.arg == 'stop_reason':
                      print(f'{node.lineno}\t{func}\t{ast.unparse(kw.value)}')

          print('=== ACTIVE STOP GATE / RUNTIME TERMINAL REASONS ===')
          for filename in [
              'src/application/research_stop_gate.py',
              'src/application/active_research_runtime.py',
          ]:
              source = Path(filename).read_text(encoding='utf-8')
              module = ast.parse(source)
              for node in ast.walk(module):
                  if not isinstance(node, ast.Call):
                      continue
                  func = node.func.attr if isinstance(node.func, ast.Attribute) else (
                      node.func.id if isinstance(node.func, ast.Name) else ''
                  )
                  if func not in {'ResearchStopDecision', '_terminal_unavailable'}:
                      continue
                  for kw in node.keywords:
                      if kw.arg != 'reason':
                          continue
                      print(f'{filename}:{node.lineno}\t{func}\t{ast.unparse(kw.value)}')
          PY
