name: Temporary Batch C stop writer audit

on:
  push:
    branches:
      - tmp/batch-c-writer-contract-repair

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve remaining WebLookupRun producer values
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          service_path = Path('src/application/web_lookup_service.py')
          service_text = service_path.read_text(encoding='utf-8')
          service_tree = ast.parse(service_text)

          print('=== stop_reason_from_payloads ===')
          for node in service_tree.body:
              if isinstance(node, ast.FunctionDef) and node.name == 'stop_reason_from_payloads':
                  print(ast.unparse(node))

          print('=== exact suspect-string occurrences in ResearchRun writer modules ===')
          suspects = {
              'empty',
              'candidates_only',
              'active_runtime_unavailable',
              'providers_failed',
              'no_tool_calls',
              'insufficient_valid_sources',
              'sources_read',
              'sources_partially_read',
              'source_reading_failed',
          }
          for filename in [
              'src/application/web_lookup_service.py',
              'src/application/active_research_runtime.py',
              'src/application/research_stop_gate.py',
              'src/repositories/web_lookup_repository.py',
              'src/infrastructure/sqlite/database.py',
          ]:
              text = Path(filename).read_text(encoding='utf-8')
              for index, line in enumerate(text.splitlines(), 1):
                  matched = sorted(value for value in suspects if value in line)
                  if matched:
                      print(f'{filename}:{index}\t{",".join(matched)}\t{line.strip()}')
          PY
