name: Temporary Batch C stop writer repair

on:
  push:
    branches:
      - tmp/batch-c-writer-contract-repair

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message != 'fix(research): close stop writer contract' }}"
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply isolated repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          catalog = Path("src/web/research/failure_contracts.py")
          text = catalog.read_text(encoding="utf-8")
          old = '        "search_candidates_only",\n        "empty",\n        "candidates_only",\n        "chat_tool_loop_failed",'
          new = '        "search_candidates_only",\n        "no_tool_calls",\n        "insufficient_valid_sources",\n        "sources_read",\n        "sources_partially_read",\n        "source_reading_failed",\n        "chat_tool_loop_failed",'
          if text.count(old) != 1:
              raise SystemExit(f"expected one frozenset stop catalog block, found {text.count(old)}")
          catalog.write_text(text.replace(old, new, 1), encoding="utf-8")

          repository = Path("src/repositories/web_lookup_repository.py")
          text = repository.read_text(encoding="utf-8")
          old = '''            raise ValueError(
                "Follow-up child requires create_request_id, parent_run_id and owner_thread_id"
            )
        context = _with_operation('''
          new = '''            raise ValueError(
                "Follow-up child requires create_request_id, parent_run_id and owner_thread_id"
            )
        stop_reason = _validated_stop_reason(run.stop_reason)
        context = _with_operation('''
          if text.count(old) != 1:
              raise SystemExit(f"expected one create_child anchor, found {text.count(old)}")
          repository.write_text(text.replace(old, new, 1), encoding="utf-8")

          script = Path(".github/tmp_batch_c_repair.py")
          source = script.read_text(encoding="utf-8")
          pattern = re.compile(
              r'replace_once\(\n'
              r'    "src/repositories/web_lookup_repository\.py",\n'
              r'    "        context = _with_operation.*?\n'
              r'\)\n'
              r'(?=replace_once\(\n'
              r'    "src/repositories/web_lookup_repository\.py",\n'
              r'    "                        child\.provider_status)',
              flags=re.DOTALL,
          )
          source, count = pattern.subn("", source, count=1)
          if count != 1:
              raise SystemExit(f"expected one ambiguous repair-script block, found {count}")
          script.write_text(source, encoding="utf-8")
          PY
          python .github/tmp_batch_c_repair.py

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 5 --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt --disable-pip-version-check --timeout 30 --retries 5

      - name: Run focused backend contract gates
        run: |
          pytest -q tests/test_research_failure_state_matrix.py
          pytest -q tests/test_active_research_runtime.py -k "v1_planning_attempt_exhaustion or recovered_model_attempt or stop_gate"
          ruff check src/web/research/failure_contracts.py src/repositories/web_lookup_repository.py tests/test_research_failure_state_matrix.py
          git diff --check

      - name: Run focused frontend contract gates
        working-directory: frontend
        run: |
          npm ci
          npx vitest run src/features/web-lookup/ChatResearchRecovery.test.tsx
          npm run build

      - name: Commit validated repair only
        run: |
          git config user.name "2002yy"
          git config user.email "146716153+2002yy@users.noreply.github.com"
          git add \
            src/web/research/failure_contracts.py \
            src/repositories/web_lookup_repository.py \
            tests/test_research_failure_state_matrix.py \
            frontend/src/features/web-lookup/researchStopReason.ts \
            frontend/src/features/web-lookup/ChatResearchRecovery.tsx \
            frontend/src/features/web-lookup/ChatResearchRecovery.test.tsx
          git diff --cached --check
          git commit -m "fix(research): close stop writer contract"
          git push origin HEAD:tmp/batch-c-writer-contract-repair
