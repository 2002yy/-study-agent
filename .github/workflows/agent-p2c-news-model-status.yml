name: Finalize P2-C News model status

on:
  push:
    branches:
      - agent/remove-legacy-news-models
    paths:
      - .github/workflows/agent-p2c-news-model-status.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-news-models
      - name: Update project status
        run: python tools/update_p2c_news_model_status.py
      - name: Remove temporary status patch files and commit
        run: |
          git rm tools/update_p2c_news_model_status.py .github/workflows/agent-p2c-news-model-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md
          git commit -m "docs: record P2-C News model exit baseline"
          git push origin HEAD:agent/remove-legacy-news-models
