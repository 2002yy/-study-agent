name: RQ1-C Authority Patch

on:
  push:
    branches:
      - codex/rq1c-bounded-qualification

permissions:
  contents: write

jobs:
  patch-authority:
    if: "${{ github.event.head_commit.message == 'chore: apply RQ1-C live13 authority patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch authoritative handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/PROJECT_STATUS.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "- **Remote CI / current branch gate：**PR #143 final head `ab4924b1a66e15ad3a9bcdefd47af227e15f3bda` 已合并为 `main@f3f17824c132e2a88caf4dac4a9d6eae78e35910`，exact-main CI [#33947613290](https://github.com/2002yy/study-agent/actions/runs/33947613290) `push / completed / success`。Draft PR #142 最新 code-bearing exact head `23287a894ae454bd82a54ad1223b35b87286124e` 的 push CI [#34113989510](https://github.com/2002yy/study-agent/actions/runs/34113989510) 与 PR CI [#34113994305](https://github.com/2002yy/study-agent/actions/runs/34113994305) 均 `completed / success`；完整 CI 门包含 pytest、RAG K1、Ruff、package helper、detect-secrets、expanded mypy baseline、frontend tests/build、browser Golden Journeys 与 real-stack browser gates。本地聚焦集 **64/64**、Ruff 全仓通过、expanded mypy baseline `122≤128 / resolved=6`、`git diff --check` 通过；本地 full pytest 未因该候选重复运行，exact-head Linux CI 负责完整终审。": "- **Remote CI / current branch gate：**PR #143 final head `ab4924b1a66e15ad3a9bcdefd47af227e15f3bda` 已合并为 `main@f3f17824c132e2a88caf4dac4a9d6eae78e35910`，exact-main CI [#33947613290](https://github.com/2002yy/study-agent/actions/runs/33947613290) `push / completed / success`。Draft PR #142 最新 code-bearing exact head `a7ada7e28605d0fae84a9dae5296dfab49928329` 的 push CI [#34117726284](https://github.com/2002yy/study-agent/actions/runs/34117726284) 与 PR CI [#34117731803](https://github.com/2002yy/study-agent/actions/runs/34117731803) 均 `completed / success`；完整 CI 门包含 pytest、RAG K1、Ruff、package helper、detect-secrets、expanded mypy baseline、frontend tests/build、browser Golden Journeys 与 real-stack browser gates。本地聚焦集 **66/66**、Ruff 全仓通过、expanded mypy baseline `122≤128 / resolved=6`、`git diff --check` 通过；本地 full pytest 未因该候选重复运行，exact-head Linux CI 负责完整终审。",
              "- **Runtime status：**首次真实 live 12（head `cd32c209…`，run [#33979582319](https://github.com/2002yy/study-agent/actions/runs/33979582319)）结果为 **0 reviewable answers / 0 completed runs / 10 failed / 2 partial / protocol probes 6/6**。head `23287a8…` 将 compact wire 升为 `ca2`，用版本化整数 code 无损表示 relevance/source role/gain signals；diagnostic [#34113989521](https://github.com/2002yy/study-agent/actions/runs/34113989521) 中 academic 不再 JSON 截断，但首波 15s timeout、后两波为 `CompactAssessmentDomainError`，仍 `read_count=0`；unverifiable 至少一波评估成功（`lead_only=2 / topic_only=2 / new_primary=2`）并产生 **read_attempt_count=2**，但成功读取仍为 0。两例最终仍为 **0/2 cases with successful reads**；下一诊断必须分别细分 compact code/domain validation 与 reader failure，不能再笼统归因 assessor。artifact 不保存 prompt、raw response、page body、query text 或 candidate identity。": "- **Runtime status：**首次真实 live 12（head `cd32c209…`，run [#33979582319](https://github.com/2002yy/study-agent/actions/runs/33979582319)）结果为 **0 reviewable answers / 0 completed runs / 10 failed / 2 partial / protocol probes 6/6**。head `a7ada7e…` 的 live13 只增加安全失败分类，不改模型、运行决策或业务门；同两例 diagnostic [#34117726273](https://github.com/2002yy/study-agent/actions/runs/34117726273) `completed / success`，两例仍为 **0/2 cases with successful reads**。assessor 失败已明确落为 `CompactAssessmentCodeError`，排除 expanded domain parser；reader 两次 durable `read_failed` 的 `exception_type` 均为空，说明 gateway 返回 negative result 而非抛异常。artifact 继续不保存 prompt、raw response、page body、query text、candidate identity 或 failure detail。",
              "- **GO / NO-GO：**RQCE-P0、P1-A0、A1–A4/B1–B5 + Hardening + P1-C 子批 1/2/3 + active steering + failure-state Batch A/B/C + PR #143 answer/claim binding = **REMOTE GO / DELIVERED**。PR #142 qualification infrastructure = **GO / CLOSED at `c3d3576c…`**；当前 assessment remediation code/CI = **REMOTE GATES GREEN at `23287a8…`**；pre-read 业务门仍为 **NOT GO / 0 OF 2 DIAGNOSTIC CASES SUCCESSFULLY READ / LIVE 12 FAILED**，default activation = **FROZEN**；RQCE-P2 = **NOT STARTED**。workflow success 与 read attempts 均不能替代成功读取门。": "- **GO / NO-GO：**RQCE-P0、P1-A0、A1–A4/B1–B5 + Hardening + P1-C 子批 1/2/3 + active steering + failure-state Batch A/B/C + PR #143 answer/claim binding = **REMOTE GO / DELIVERED**。PR #142 qualification infrastructure = **GO / CLOSED at `c3d3576c…`**；当前 diagnostic classification code/CI = **REMOTE GATES GREEN at `a7ada7e…`**；pre-read 业务门仍为 **NOT GO / 0 OF 2 DIAGNOSTIC CASES SUCCESSFULLY READ / LIVE 12 FAILED**，default activation = **FROZEN**；RQCE-P2 = **NOT STARTED**。workflow success、分类成功与 read attempts 均不能替代成功读取门。",
              "- **唯一下一步：**保持 `ca2`、既有领域 parser、untouched manifest/rubric/Evidence Gate、预算/timeout、2-candidate window 与 default activation 不变；只增加无内容/无身份的安全诊断分类：将 compact code decoding 与 expanded domain validation 分成不同 exception type，并在 pre-read artifact 聚合 reader failure 的 bounded canonical error type/count。聚焦门 → exact-head push/PR CI → 同两例 diagnostic；根据分类只修对应 owner。只有两例均产生真实成功读取才允许 untouched live 12。禁止读取/保存 raw response、下载/切换模型、heuristic/legacy fallback。": "- **唯一下一步：**保持 `ca2`、既有领域 parser、untouched manifest/rubric/Evidence Gate、预算/timeout、2-candidate window 与 default activation 不变；只继续下一层无内容/无身份安全分类：assessor 的 `CompactAssessmentCodeError` 细分为 relevance / source-role / gain-signal / duplicate，reader 细分为 exception / empty-content / gateway-negative-result，并仅聚合受限 canonical provider code。该切片不得改变模型、prompt、token/timeout、候选/读取调度、Evidence Gate 或任何业务终态。聚焦门 → exact-head push/PR CI → 同两例 diagnostic；根据分类只修对应 owner。只有两例均产生真实成功读取才允许 untouched live 12。禁止读取/保存 raw response、下载/切换模型、heuristic/legacy fallback。",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('authoritative paragraph drifted; refusing patch')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/rq1c-authority-patch.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md .github/workflows/rq1c-authority-patch.yml
          git diff --cached --check
          git commit -m "docs: record RQ1-C live13 diagnostic"
          git push origin HEAD:${GITHUB_REF_NAME}
