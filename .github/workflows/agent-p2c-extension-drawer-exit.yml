name: Apply P2-C extension drawer exit
on:
  push:
    branches: [agent/remove-legacy-extension-drawers]
    paths:
      - .github/workflows/agent-p2c-extension-drawer-exit.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-extension-drawers
          fetch-depth: 0
      - name: Apply exact patch
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"pattern missing: {path}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "frontend/src/types.ts",
              '''export type DrawerId =\n  | "group"\n  | "tools"\n  | "sessions"\n  | "memory"\n  | "settings"\n  | "sources"\n  | "timeline";''',
              '''export type DrawerId =\n  | "sessions"\n  | "memory"\n  | "settings"\n  | "sources"\n  | "lab";''',
          )

          Path("frontend/src/features/extensions/extensionDrawerContract.ts").write_text('''import type { DrawerId } from "../../types";\n\nexport const EXTENSION_CAPABILITIES = ["group", "tools", "timeline"] as const;\n\nexport type ExtensionCapabilityId = (typeof EXTENSION_CAPABILITIES)[number];\nexport type ExtensionSurfaceId = "lab";\n\nexport const LAB_DRAWER: DrawerId = "lab";\n\nexport function selectExtensionSurface(\n  drawer: DrawerId | null | undefined,\n): ExtensionSurfaceId | null {\n  return drawer === LAB_DRAWER ? "lab" : null;\n}\n\nexport function resolveExtensionCapability(\n  surface: ExtensionSurfaceId | null,\n  selected: ExtensionCapabilityId | null,\n): ExtensionCapabilityId | null {\n  return surface === "lab" ? selected : null;\n}\n''', encoding="utf-8")

          replace(
              "frontend/src/features/extensions/ExtensionLauncher.tsx",
              'import type { DrawerId } from "../../types";\nimport { LAB_DRAWER } from "./extensionDrawerContract";',
              'import type { DrawerId } from "../../types";\nimport { LAB_DRAWER } from "./extensionDrawerContract";',
          )

          replace(
              "frontend/src/features/extensions/ExtensionLabPanel.tsx",
              'ExtensionDrawerId',
              'ExtensionCapabilityId',
          )

          replace(
              "frontend/src/app/ExtensionDrawers.tsx",
              'ExtensionDrawerId',
              'ExtensionCapabilityId',
          )
          replace(
              "frontend/src/app/ExtensionDrawers.tsx",
              'view.activeSurface === "lab" && capability && !view.isLegacySurface',
              'view.activeSurface === "lab" && capability',
          )

          p = Path("frontend/src/app/useExtensionRuntime.ts")
          text = p.read_text(encoding="utf-8")
          text = text.replace('  selectExtensionDrawer,\n', '')
          text = text.replace('ExtensionDrawerId', 'ExtensionCapabilityId')
          text = text.replace('  activeDrawer: ExtensionCapabilityId | null;\n', '')
          text = text.replace('  isLegacySurface: boolean;\n', '')
          text = text.replace('  const activeDrawer = selectExtensionDrawer(state.activeDrawer);\n', '')
          text = text.replace('    activeDrawer: activeCapability,\n', '')
          text = text.replace('    isLegacySurface: activeDrawer !== null,\n', '')
          p.write_text(text, encoding="utf-8")

          Path("frontend/src/features/extensions/extensionDrawerContract.test.ts").write_text('''import { describe, expect, it } from "vitest";\n\nimport {\n  EXTENSION_CAPABILITIES,\n  resolveExtensionCapability,\n  selectExtensionSurface,\n} from "./extensionDrawerContract";\n\ndescribe("extension drawer contract", () => {\n  it("keeps capability ids separate from drawer surfaces", () => {\n    expect(EXTENSION_CAPABILITIES).toEqual(["group", "tools", "timeline"]);\n  });\n\n  it("recognizes laboratory as the only extension drawer surface", () => {\n    expect(selectExtensionSurface("lab")).toBe("lab");\n    expect(selectExtensionSurface("group" as never)).toBeNull();\n    expect(selectExtensionSurface("tools" as never)).toBeNull();\n    expect(selectExtensionSurface("timeline" as never)).toBeNull();\n  });\n\n  it("keeps laboratory dormant until a capability is selected", () => {\n    expect(resolveExtensionCapability("lab", null)).toBeNull();\n    expect(resolveExtensionCapability("lab", "group")).toBe("group");\n    expect(resolveExtensionCapability("lab", "tools")).toBe("tools");\n    expect(resolveExtensionCapability("lab", "timeline")).toBe("timeline");\n    expect(resolveExtensionCapability(null, "group")).toBeNull();\n  });\n\n  it("keeps ordinary and missing drawers outside Extension loading", () => {\n    expect(selectExtensionSurface(null)).toBeNull();\n    expect(selectExtensionSurface(undefined)).toBeNull();\n    expect(selectExtensionSurface("sessions")).toBeNull();\n    expect(selectExtensionSurface("memory")).toBeNull();\n    expect(selectExtensionSurface("settings")).toBeNull();\n    expect(selectExtensionSurface("sources")).toBeNull();\n  });\n});\n''', encoding="utf-8")

          p = Path("frontend/src/app/extensionLabBoundary.test.ts")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              'expect(contractSource).toContain(\'export const LAB_DRAWER = "lab" as DrawerId\');',
              'expect(contractSource).toContain(\'export const LAB_DRAWER: DrawerId = "lab"\');',
          )
          old = '''  it("retains old drawer ids only as compatibility surfaces", () => {\n    expect(runtimeSource).toContain("selectExtensionDrawer(state.activeDrawer)");\n    expect(drawersSource).toContain("view.isLegacySurface");\n    expect(launcherSource).not.toContain('\"group\"');\n    expect(launcherSource).not.toContain('\"tools\"');\n    expect(launcherSource).not.toContain('\"timeline\"');\n  });'''
          new = '''  it("does not retain legacy capability drawer surfaces", () => {\n    expect(runtimeSource).not.toContain("selectExtensionDrawer");\n    expect(drawersSource).not.toContain("isLegacySurface");\n    expect(launcherSource).not.toContain('onOpen(\"group\"');\n    expect(launcherSource).not.toContain('onOpen(\"tools\"');\n    expect(launcherSource).not.toContain('onOpen(\"timeline\"');\n  });'''
          if old not in text:
              raise SystemExit("extensionLabBoundary legacy test pattern missing")
          p.write_text(text.replace(old, new), encoding="utf-8")
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/agent-p2c-extension-drawer-exit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "remove legacy extension drawer compatibility"
          git push origin HEAD:agent/remove-legacy-extension-drawers
