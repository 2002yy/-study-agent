name: RQ1-C Fixture Migration

on:
  push:
    branches:
      - codex/rq1c-bounded-qualification

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ github.event.head_commit.message == 'rq1c-fixture-migration' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Migrate anchored planner fixtures
        shell: python
        run: |
          from pathlib import Path

          active = Path('tests/test_active_research_runtime.py')
          text = active.read_text(encoding='utf-8')
          start_marker = '        if "claim planner" in system:\n'
          end_marker = '        elif "search candidates" in system:\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''        if "claim planner" in system:
              question = str(request["question"])
              critical_anchor = question if len(question) <= 160 else question[:160].rstrip()
              supporting_claims: list[dict[str, str]] = []
              if self.claims_count > 1:
                  supporting_anchor = next(
                      (
                          anchor
                          for anchor in ("verified current release date", "release date")
                          if anchor in question and anchor != critical_anchor
                      ),
                      None,
                  )
                  if supporting_anchor is None:
                      raise AssertionError(
                          "multi-claim fixture requires a distinct question anchor"
                      )
                  supporting_claims.append(
                      {
                          "question_anchor": supporting_anchor,
                          "kind": "factual",
                          "policy_profile": "current_fact",
                      }
                  )
              payload = {
                  "schema_version": "research-runtime-claim-plan-v1",
                  "critical_claim": {
                      "question_anchor": critical_anchor,
                      "kind": "factual",
                      "policy_profile": "current_fact",
                  },
                  "supporting_claims": supporting_claims,
              }
'''
          text = text[:start] + replacement + text[end:]
          old_extract = '''            if "official project" in claim_text:
                  locator = "2026-08-01"
                  anchored_spans = ["2026-08-01"]
              else:
                  locator = "release date"
                  anchored_spans = ["release date"]
'''
          new_extract = '''            if claim_text in {"verified current release date", "release date"}:
                  locator = "2026-08-01"
                  anchored_spans = ["2026-08-01"]
              else:
                  locator = "release date"
                  anchored_spans = ["release date"]
'''
          if text.count(old_extract) != 1:
              raise SystemExit('expected extraction fixture branch exactly once')
          text = text.replace(old_extract, new_extract, 1)
          active.write_text(text, encoding='utf-8')

          budget = Path('tests/test_claim_planner_execution_budget.py')
          text = budget.read_text(encoding='utf-8')
          old_assert = '''    assert [(claim.text, claim.priority) for claim in result.state.claims] == [
              ("verified current release date", "critical"),
              ("release date", "major"),
          ]
'''
          new_assert = '''    assert {(claim.text, claim.priority) for claim in result.state.claims} == {
              ("verified current release date", "critical"),
              ("release date", "major"),
          }
'''
          if text.count(old_assert) != 1:
              raise SystemExit('expected priority assertion exactly once')
          budget.write_text(text.replace(old_assert, new_assert, 1), encoding='utf-8')
      - name: Run focused planner/runtime tests
        run: pytest -q tests/test_claim_planner_execution_budget.py tests/test_active_research_runtime.py
      - name: Run focused Ruff
        run: ruff check tests/test_claim_planner_execution_budget.py tests/test_active_research_runtime.py
      - name: Commit validated migration and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rq1c-fixture-migrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_active_research_runtime.py tests/test_claim_planner_execution_budget.py .github/workflows/rq1c-fixture-migrate.yml
          git diff --cached --check
          git commit -m "test(research): finish anchored planner fixture migration"
          git push origin HEAD:codex/rq1c-bounded-qualification
