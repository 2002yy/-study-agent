name: RQ1-C Qualification Contract Patch Runner

on:
  push:
    branches:
      - codex/rq1c-bounded-qualification

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'ci: run rq1c qualification contract compatibility patch' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/rq1c-bounded-qualification
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply reviewed compatibility patch
        run: python tools/_tmp_patch_rq1c_qualification_contract.py
      - name: Focused qualification contract gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_rq1c_bounded_pre_dispatch_budget.py \
            tests/test_rq1c_bounded_qualification.py
          ruff check \
            tools/rq1c_qualification_guardrails.py \
            tools/run_rq1c_bounded_qualification_core.py \
            tools/evaluate_rq1c_bounded_qualification.py \
            tests/test_rq1c_bounded_pre_dispatch_budget.py \
            tests/test_rq1c_bounded_qualification.py
          python -m py_compile \
            tools/rq1c_qualification_guardrails.py \
            tools/run_rq1c_bounded_qualification_core.py \
            tools/evaluate_rq1c_bounded_qualification.py
          git diff --check
      - name: Verify bounded source scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort | tee /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          tests/fixtures/research_quality/rq1c_bounded_holdout_rubric.json
          tests/test_rq1c_bounded_pre_dispatch_budget.py
          tests/test_rq1c_bounded_qualification.py
          tools/evaluate_rq1c_bounded_qualification.py
          tools/rq1c_qualification_guardrails.py
          tools/run_rq1c_bounded_qualification_core.py
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Commit source-only compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            tests/fixtures/research_quality/rq1c_bounded_holdout_rubric.json \
            tests/test_rq1c_bounded_pre_dispatch_budget.py \
            tests/test_rq1c_bounded_qualification.py \
            tools/evaluate_rq1c_bounded_qualification.py \
            tools/rq1c_qualification_guardrails.py \
            tools/run_rq1c_bounded_qualification_core.py
          git diff --cached --check
          git commit -m "fix(qualification): reconcile shared call and hosted execution budgets"
          git push origin HEAD:codex/rq1c-bounded-qualification
