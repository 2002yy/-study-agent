name: RQ1-C Pre-read Local Stage Screen

on:
  push:
    branches:
      - codex/rq1c-bounded-qualification

permissions:
  contents: read

concurrency:
  group: rq1c-preread-local-stage-screen
  cancel-in-progress: false

jobs:
  screen:
    if: "${{ github.event.head_commit.message == 'rq1c-preread-local-stage-screen-live17' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      LLM_PROVIDER_PROFILE: local
      LOCAL_API_KEY: local
      LOCAL_BASE_URL: http://127.0.0.1:8000/v1
      LOCAL_MODEL_FLASH_NAME: rq1c-qwen3-4b-instruct-2507-q4km
      LOCAL_MODEL_PRO_NAME: rq1c-qwen3-4b-instruct-2507-q4km
      LOCAL_DEFAULT_MODEL_PROFILE: flash
      DEFAULT_MODEL_PROFILE: flash
      LOCAL_MAX_RETRIES: '0'
      LLM_MAX_RETRIES: '0'
      LOCAL_TIMEOUT_SECONDS: '20'
      LLM_TIMEOUT_SECONDS: '20'
      RESEARCH_CLAIM_PLANNER_BASE_URL: http://127.0.0.1:8001/v1
      RESEARCH_CLAIM_PLANNER_MODEL_NAME: rq1c-qwen25-15b-instruct-q4km
      RESEARCH_CLAIM_PLANNER_API_KEY: local
      RESEARCH_CANDIDATE_ASSESSOR_BASE_URL: http://127.0.0.1:8000/v1
      RESEARCH_CANDIDATE_ASSESSOR_MODEL_NAME: rq1c-qwen3-4b-instruct-2507-q4km
      RESEARCH_CANDIDATE_ASSESSOR_API_KEY: local
      WEB_TOOL_ENABLED: 'true'
      WEB_ENABLE_DUCKDUCKGO: 'true'
      WEB_ENABLE_SEARXNG: 'false'
      WEB_ENABLE_BING_RSS: 'true'
      WEB_SEARCH_PROVIDER_TIMEOUT_SECONDS: '6'
      WEB_SEARCH_TOTAL_TIMEOUT_SECONDS: '8'
      NEWS_ENABLE_FIRECRAWLER_READER: 'false'
      NEWS_ENABLE_FIRECRAWL_READER: 'false'
      NEWS_ENABLE_JINA_READER: 'false'
      LLAMA_CPP_TAG: b10809
      LLAMA_CPP_ARCHIVE_SHA256: 5e34434ddc6d03cd1584f403201aff0d4bd1a5793a72ff7e286532dfd1e4b941
      HF_MODEL_REPO: unsloth/Qwen3-4B-Instruct-2507-GGUF
      HF_MODEL_FILE: Qwen3-4B-Instruct-2507-Q4_K_M.gguf
      MODEL_ALIAS: rq1c-qwen3-4b-instruct-2507-q4km
      PLANNER_HF_MODEL_REPO: Qwen/Qwen2.5-1.5B-Instruct-GGUF
      PLANNER_HF_MODEL_FILE: qwen2.5-1.5b-instruct-q4_k_m.gguf
      PLANNER_MODEL_SHA256_EXPECTED: 6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e
      PLANNER_MODEL_ALIAS: rq1c-qwen25-15b-instruct-q4km

    steps:
      - name: Check out exact screen head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Study Agent dependencies
        run: pip install -r requirements.txt

      - name: Install pinned llama.cpp CPU server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local-llama .local-model output
          archive=.local-llama/llama.tar.gz
          curl -fL --retry 4 --retry-delay 2 \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_TAG}/llama-${LLAMA_CPP_TAG}-bin-ubuntu-x64.tar.gz" \
            -o "$archive"
          echo "${LLAMA_CPP_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C .local-llama
          server="$(find .local-llama -type f -name llama-server -print -quit)"
          test -n "$server"
          chmod +x "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"

      - name: Download pinned Qwen3 4B GGUF
        shell: bash
        run: |
          set -euo pipefail
          model=.local-model/${HF_MODEL_FILE}
          curl -fL --retry 5 --retry-delay 3 \
            "https://huggingface.co/${HF_MODEL_REPO}/resolve/main/${HF_MODEL_FILE}?download=true" \
            -o "$model"
          test -s "$model"
          echo "MODEL_PATH=$model" >> "$GITHUB_ENV"

      - name: Download pinned planner GGUF
        shell: bash
        run: |
          set -euo pipefail
          model=.local-model/${PLANNER_HF_MODEL_FILE}
          curl -fL --retry 5 --retry-delay 3 \
            "https://huggingface.co/${PLANNER_HF_MODEL_REPO}/resolve/main/${PLANNER_HF_MODEL_FILE}?download=true" \
            -o "$model"
          test -s "$model"
          actual="$(sha256sum "$model" | awk '{print $1}')"
          test "$actual" = "$PLANNER_MODEL_SHA256_EXPECTED"
          echo "PLANNER_MODEL_PATH=$model" >> "$GITHUB_ENV"

      - name: Start candidate-assessment model server
        shell: bash
        run: |
          set -euo pipefail
          "$LLAMA_SERVER" -m "$MODEL_PATH" --alias "$MODEL_ALIAS" --host 127.0.0.1 --port 8000 -c 8192 -np 1 -t "$(nproc)" --jinja > output/llama-server.log 2>&1 &
          echo $! > output/llama-server.pid
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat output/llama-server.pid)" 2>/dev/null; then exit 1; fi
            sleep 2
          done
          exit 1

      - name: Start planner model server
        shell: bash
        run: |
          set -euo pipefail
          "$LLAMA_SERVER" -m "$PLANNER_MODEL_PATH" --alias "$PLANNER_MODEL_ALIAS" --host 127.0.0.1 --port 8001 -c 4096 -np 1 -t "$(nproc)" --jinja > output/planner-server.log 2>&1 &
          echo $! > output/planner-server.pid
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat output/planner-server.pid)" 2>/dev/null; then exit 1; fi
            sleep 2
          done
          exit 1

      - name: Run bounded local-stage screen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          import threading
          import src.news.article_fetcher as article_fetcher
          import tools.run_rq1c_preread_diagnostic as diag

          state = threading.local()
          original_fetch_html = article_fetcher._fetch_html_payload
          original_local_reader = article_fetcher.read_html_locally

          def bump(key):
              collector = getattr(state, 'collector', None)
              if collector is not None:
                  collector._stage_counts[key] = collector._stage_counts.get(key, 0) + 1

          def screened_fetch_html(*args, **kwargs):
              try:
                  html, final_url, content_type, reason = original_fetch_html(*args, **kwargs)
              except Exception:
                  bump('fetch_exception')
                  raise
              if reason:
                  if reason == 'non_html_resource':
                      bump('fetch_non_html')
                  elif reason == 'unsafe_redirect_target':
                      bump('fetch_blocked_redirect')
                  else:
                      bump('fetch_rejected_other')
              elif str(html or '').strip():
                  bump('fetch_html_nonempty')
              else:
                  bump('fetch_html_empty')
              return html, final_url, content_type, reason

          def screened_local_reader(*args, **kwargs):
              result = original_local_reader(*args, **kwargs)
              if result.ok:
                  bump('local_reader_ok')
              elif str(result.error or '').strip():
                  bump('local_reader_error')
              else:
                  bump('local_reader_empty')
              return result

          article_fetcher._fetch_html_payload = screened_fetch_html
          article_fetcher.read_html_locally = screened_local_reader

          class StageDiagnosticReadGateway(diag._DiagnosticReadGateway):
              def __init__(self, inner=None):
                  super().__init__(inner)
                  self._stage_counts = {}

              def read(self, url, *, max_chars=6000):
                  state.collector = self
                  try:
                      return super().read(url, max_chars=max_chars)
                  finally:
                      state.collector = None

              def summary(self):
                  summary = super().summary()
                  summary['local_stage_counts'] = dict(sorted(self._stage_counts.items()))
                  return summary

          diag._DiagnosticReadGateway = StageDiagnosticReadGateway
          sys.argv = [
              'run_rq1c_preread_diagnostic.py',
              '--manifest', 'tests/fixtures/research_quality/rq1c_bounded_holdout_manifest.json',
              '--reference-date', '2026-09-05',
              '--output', 'output/rq1c-preread-local-stage-screen.json',
          ]
          raise SystemExit(diag.main())
          PY

      - name: Enforce safe screen shape
        shell: python
        run: |
          import json
          from pathlib import Path
          data = json.loads(Path('output/rq1c-preread-local-stage-screen.json').read_text(encoding='utf-8'))
          assert len(data['cases']) == 2
          assert data['stores_raw_model_text'] is False
          assert data['stores_query_text'] is False
          assert data['stores_page_bodies'] is False
          allowed = {
              'fetch_exception', 'fetch_non_html', 'fetch_blocked_redirect',
              'fetch_rejected_other', 'fetch_html_nonempty', 'fetch_html_empty',
              'local_reader_ok', 'local_reader_error', 'local_reader_empty'
          }
          forbidden = {'prompt', 'response_text', 'page_body', 'query_text', 'candidate_id', 'url'}
          def walk(value):
              if isinstance(value, dict):
                  assert forbidden.isdisjoint(value.keys())
                  if 'local_stage_counts' in value:
                      assert set(value['local_stage_counts']).issubset(allowed)
                  for nested in value.values(): walk(nested)
              elif isinstance(value, list):
                  for nested in value: walk(nested)
          walk(data)

      - name: Upload bounded screen evidence
        uses: actions/upload-artifact@v4
        with:
          name: rq1c-preread-local-stage-screen
          path: output/rq1c-preread-local-stage-screen.json
          if-no-files-found: error
          retention-days: 7
