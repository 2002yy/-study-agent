name: RQ1C P16 bounded fix

on:
  push:
    branches:
      - codex/rq1c-bounded-qualification

permissions:
  contents: write

jobs:
  patch-and-test:
    if: contains(github.event.head_commit.message, '[rq1c-p16-patch]')
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/rq1c-bounded-qualification
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 5 --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt --disable-pip-version-check --timeout 30 --retries 5

      - name: Apply bounded fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/web/research/candidate_assessment.py",
              '''class CompactAssessmentGainSignalDuplicateError(CompactAssessmentCodeError):
              """Compact gain-signal list repeats a decoded semantic value."""
          ''',
              '''class CompactAssessmentGainSignalDuplicateError(CompactAssessmentCodeError):
              """Legacy subtype retained for compatibility with older diagnostics."""
          ''',
          )
          replace_once(
              "src/web/research/candidate_assessment.py",
              '''def _compact_codes(value: Any, codes: Mapping[int, str]) -> list[str]:
              if not isinstance(value, list):
                  raise CompactAssessmentGainSignalCodeError("compact gain signal codes invalid")
              result: list[str] = []
              for item in value:
                  decoded = _compact_code(
                      item,
                      codes,
                      "gain signal",
                      CompactAssessmentGainSignalCodeError,
                  )
                  if decoded in result:
                      raise CompactAssessmentGainSignalDuplicateError(
                          "compact gain signal codes duplicate"
                      )
                  result.append(decoded)
              return result
          ''',
              '''def _compact_codes(value: Any, codes: Mapping[int, str]) -> list[str]:
              if not isinstance(value, list) or len(value) > len(codes):
                  raise CompactAssessmentGainSignalCodeError("compact gain signal codes invalid")
              result: list[str] = []
              for item in value:
                  decoded = _compact_code(
                      item,
                      codes,
                      "gain signal",
                      CompactAssessmentGainSignalCodeError,
                  )
                  if decoded not in result:
                      result.append(decoded)
              return result
          ''',
          )

          replace_once(
              "src/web/research/active_semantics.py",
              '''class RuntimeCandidateAssessor:
              def __init__(self, model_gateway: ResearchModelGateway) -> None:
                  self._durable_max_attempts = model_gateway.max_attempts
                  self.model_gateway = _candidate_assessor_gateway(model_gateway)
          ''',
              '''class RuntimeCandidateAssessor:
              def __init__(
                  self,
                  model_gateway: ResearchModelGateway,
                  *,
                  timeout_cap_seconds: float = CANDIDATE_ASSESSMENT_TIMEOUT_SECONDS,
              ) -> None:
                  if isinstance(timeout_cap_seconds, bool):
                      raise ValueError("candidate assessment timeout cap must be positive")
                  try:
                      timeout_cap = float(timeout_cap_seconds)
                  except (TypeError, ValueError) as exc:
                      raise ValueError("candidate assessment timeout cap must be positive") from exc
                  if not isfinite(timeout_cap) or timeout_cap <= 0:
                      raise ValueError("candidate assessment timeout cap must be positive")
                  self._durable_max_attempts = model_gateway.max_attempts
                  self.timeout_cap_seconds = timeout_cap
                  self.model_gateway = _candidate_assessor_gateway(model_gateway)
          ''',
          )
          replace_once(
              "src/web/research/active_semantics.py",
              '''        assessment_timeout = CANDIDATE_ASSESSMENT_TIMEOUT_SECONDS
                  if timeout_seconds is not None:
                      assessment_timeout = min(assessment_timeout, float(timeout_seconds))
          ''',
              '''        assessment_timeout = self.timeout_cap_seconds
                  if timeout_seconds is not None:
                      assessment_timeout = min(assessment_timeout, float(timeout_seconds))
          ''',
          )

          replace_once(
              "src/application/active_research_runtime.py",
              "from math import ceil\n",
              "from math import ceil, isfinite\n",
          )
          replace_once(
              "src/application/active_research_runtime.py",
              '''from src.web.research.active_semantics import (
              RuntimeCandidateAssessor,
              RuntimeEvidenceExtractor,
          )
          ''',
              '''from src.web.research.active_semantics import (
              CANDIDATE_ASSESSMENT_TIMEOUT_SECONDS,
              RuntimeCandidateAssessor,
              RuntimeEvidenceExtractor,
          )
          ''',
          )
          replace_once(
              "src/application/active_research_runtime.py",
              '''        policy_check: PolicyCheck | None = None,
                  monotonic: Callable[[], float] = time.monotonic,
                  utc_now: Callable[[], str] | None = None,
              ) -> None:
                  self.repository = repository
                  self.gateway = gateway
                  shared_model = model_gateway or ResearchModelGateway(timeout_seconds=20.0)
                  self.claim_planner = claim_planner or RuntimeClaimPlanner(shared_model)
                  self.candidate_assessor = candidate_assessor or RuntimeCandidateAssessor(shared_model)
                  self.evidence_extractor = evidence_extractor or RuntimeEvidenceExtractor(shared_model)
          ''',
              '''        policy_check: PolicyCheck | None = None,
                  monotonic: Callable[[], float] = time.monotonic,
                  utc_now: Callable[[], str] | None = None,
                  model_timeout_cap_seconds: float = 20.0,
                  candidate_assessment_timeout_cap_seconds: float = CANDIDATE_ASSESSMENT_TIMEOUT_SECONDS,
              ) -> None:
                  self.repository = repository
                  self.gateway = gateway
                  if isinstance(model_timeout_cap_seconds, bool):
                      raise ValueError("model timeout cap must be positive")
                  try:
                      model_timeout_cap = float(model_timeout_cap_seconds)
                  except (TypeError, ValueError) as exc:
                      raise ValueError("model timeout cap must be positive") from exc
                  if not isfinite(model_timeout_cap) or model_timeout_cap <= 0:
                      raise ValueError("model timeout cap must be positive")
                  self.model_timeout_cap_seconds = model_timeout_cap
                  shared_model = model_gateway or ResearchModelGateway(timeout_seconds=20.0)
                  self.claim_planner = claim_planner or RuntimeClaimPlanner(shared_model)
                  self.candidate_assessor = candidate_assessor or RuntimeCandidateAssessor(
                      shared_model,
                      timeout_cap_seconds=candidate_assessment_timeout_cap_seconds,
                  )
                  self.evidence_extractor = evidence_extractor or RuntimeEvidenceExtractor(shared_model)
          ''',
          )
          replace_once(
              "src/application/active_research_runtime.py",
              '''        def remaining_timeout() -> float:
                  return max(1.0, min(20.0, state.budget.hard_timeout_seconds - elapsed()))
          ''',
              '''        def remaining_timeout() -> float:
                  return max(
                      1.0,
                      min(
                          self.model_timeout_cap_seconds,
                          state.budget.hard_timeout_seconds - elapsed(),
                      ),
                  )
          ''',
          )

          replace_once(
              "src/web/tool_gateway.py",
              '''    return results
          
          
          class GeneralWebGateway:
          ''',
              '''    return results
          
          
          _READ_ERROR_CODE_BY_REASON = {
              "unsafe_or_empty_url": "invalid_url",
              "empty_cache_entry": "fetch_failed",
              "unsafe_redirect_target": "blocked",
              "non_html_resource": "unsupported",
              "all_backends_failed": "provider_failed",
          }
          
          
          def _canonical_read_error_code(reason: str) -> str:
              value = str(reason or "").strip()
              if value.startswith("exception:"):
                  return "provider_failed"
              return _READ_ERROR_CODE_BY_REASON.get(value, "other")
          
          
          class GeneralWebGateway:
          ''',
          )
          replace_once(
              "src/web/tool_gateway.py",
              '''        if not result.ok:
                  return {
                      "ok": False,
                      "url": result.requested_url,
                      "error": result.reason or "page_read_failed",
                  }
          ''',
              '''        if not result.ok:
                  return {
                      "ok": False,
                      "url": result.requested_url,
                      "error": result.reason or "page_read_failed",
                      "error_code": _canonical_read_error_code(result.reason),
                  }
          ''',
          )

          replace_once(
              "tools/run_rq1c_preread_diagnostic.py",
              "import argparse\nimport hashlib\n",
              "import argparse\nfrom dataclasses import replace\nimport hashlib\n",
          )
          replace_once(
              "tools/run_rq1c_preread_diagnostic.py",
              '''from src.application.active_research_runtime import (  # noqa: E402
              ACTIVE_RESEARCH_ASSESSMENTS_KEY,
              ACTIVE_RESEARCH_METRICS_KEY,
          )
          ''',
              '''from src.application.active_research_runtime import (  # noqa: E402
              ACTIVE_RESEARCH_ASSESSMENTS_KEY,
              ACTIVE_RESEARCH_METRICS_KEY,
              ActiveResearchRuntimeExecutor,
          )
          ''',
          )
          replace_once(
              "tools/run_rq1c_preread_diagnostic.py",
              '''from src.web.research.active_adapter import ActiveResearchGateway  # noqa: E402
          from src.web.research_gateway import ResearchWebGateway  # noqa: E402
          ''',
              '''from src.web.research.active_adapter import ActiveResearchGateway  # noqa: E402
          from src.web.research.state import (  # noqa: E402
              attach_claim_engine_state,
              load_claim_engine_state,
          )
          from src.web.research_gateway import ResearchWebGateway  # noqa: E402
          ''',
          )
          replace_once(
              "tools/run_rq1c_preread_diagnostic.py",
              '''written to the artifact.
          """
          ''',
              '''written to the artifact. Candidate/read/material limits remain identical to
          qualification; diagnostic-only wall-clock allowances are infrastructure controls and
          are explicitly not qualification gates.
          """
          ''',
          )
          replace_once(
              "tools/run_rq1c_preread_diagnostic.py",
              '''DEFAULT_OUTPUT = REPO_ROOT / "output" / "rq1c-preread-starvation-diagnostic.json"
          _ASSESSOR_FAILURE_CATEGORY_BY_TYPE = {
          ''',
              '''DEFAULT_OUTPUT = REPO_ROOT / "output" / "rq1c-preread-starvation-diagnostic.json"
          DIAGNOSTIC_SOFT_TIMEOUT_SECONDS = 240.0
          DIAGNOSTIC_HARD_TIMEOUT_SECONDS = 300.0
          DIAGNOSTIC_MODEL_TIMEOUT_CAP_SECONDS = 120.0
          DIAGNOSTIC_ASSESSOR_TIMEOUT_CAP_SECONDS = 120.0
          _ASSESSOR_FAILURE_CATEGORY_BY_TYPE = {
          ''',
          )
          replace_once(
              "tools/run_rq1c_preread_diagnostic.py",
              '''def _run_case(
              *,
              case: Mapping[str, str],
          ''',
              '''def _diagnostic_active_context(reference_date: str) -> dict[str, Any]:
              context = _active_context(reference_date)
              loaded = load_claim_engine_state(context, known_evidence_ids=())
              if not loaded.available or loaded.state is None:
                  raise RuntimeError("diagnostic active context is unavailable")
              state = replace(
                  loaded.state,
                  budget=replace(
                      loaded.state.budget,
                      soft_timeout_seconds=DIAGNOSTIC_SOFT_TIMEOUT_SECONDS,
                      hard_timeout_seconds=DIAGNOSTIC_HARD_TIMEOUT_SECONDS,
                  ),
              )
              return attach_claim_engine_state(context, state, known_evidence_ids=())
          
          
          def _diagnostic_runtime_factory(
              repository: WebLookupRepository,
              gateway: ActiveResearchGateway,
          ) -> ActiveResearchRuntimeExecutor:
              return ActiveResearchRuntimeExecutor(
                  repository,
                  gateway,
                  model_timeout_cap_seconds=DIAGNOSTIC_MODEL_TIMEOUT_CAP_SECONDS,
                  candidate_assessment_timeout_cap_seconds=(
                      DIAGNOSTIC_ASSESSOR_TIMEOUT_CAP_SECONDS
                  ),
              )
          
          
          def _run_case(
              *,
              case: Mapping[str, str],
          ''',
          )
          replace_once(
              "tools/run_rq1c_preread_diagnostic.py",
              "            research_context=_active_context(reference_date),\n",
              "            research_context=_diagnostic_active_context(reference_date),\n",
          )
          replace_once(
              "tools/run_rq1c_preread_diagnostic.py",
              '''    service = ClaimEngineDispatchWebLookupService(
              repository,
              active_gateway_factory=lambda: ActiveResearchGateway(read_gateway=diagnostic_reader),
          )
          ''',
              '''    service = ClaimEngineDispatchWebLookupService(
              repository,
              active_gateway_factory=lambda: ActiveResearchGateway(read_gateway=diagnostic_reader),
              active_runtime_factory=_diagnostic_runtime_factory,
          )
          ''',
          )
          replace_once(
              "tools/run_rq1c_preread_diagnostic.py",
              '''        "configured_budget": {
                  "max_candidates": 20,
                  "max_reads": 8,
                  "soft_timeout_seconds": 45,
                  "hard_timeout_seconds": 60,
              },
          ''',
              '''        "configured_budget": {
                  "max_candidates": 20,
                  "max_reads": 8,
                  "max_total_chars": 16000,
                  "soft_timeout_seconds": DIAGNOSTIC_SOFT_TIMEOUT_SECONDS,
                  "hard_timeout_seconds": DIAGNOSTIC_HARD_TIMEOUT_SECONDS,
                  "model_timeout_cap_seconds": DIAGNOSTIC_MODEL_TIMEOUT_CAP_SECONDS,
                  "candidate_assessment_timeout_cap_seconds": (
                      DIAGNOSTIC_ASSESSOR_TIMEOUT_CAP_SECONDS
                  ),
                  "wall_clock_is_qualification_gate": False,
              },
          ''',
          )

          replace_once(
              "tests/test_research_candidate_assessment.py",
              '''        ("g", [99], CompactAssessmentGainSignalCodeError),
                  ("g", [0, 0], CompactAssessmentGainSignalDuplicateError),
          ''',
              '''        ("g", [99], CompactAssessmentGainSignalCodeError),
          ''',
          )
          replace_once(
              "tests/test_research_candidate_assessment.py",
              '''def test_compact_code_subclasses_preserve_fail_closed_base_contract() -> None:
          ''',
              '''def test_compact_parser_deduplicates_legal_gain_signals_in_order() -> None:
              candidate = _candidate("a")
              request = build_candidate_assessment_request((candidate,), claim=_claim())
              parsed = parse_compact_candidate_assessment_response(
                  {
                      "v": CANDIDATE_ASSESSMENT_WIRE_SCHEMA_VERSION,
                      "a": [
                          {
                              "i": 0,
                              "r": 0,
                              "rc": 0.8,
                              "s": 1,
                              "sc": 0.9,
                              "g": [0, 0, 1, 0],
                          }
                      ],
                  },
                  request=request,
                  cluster_assignments={"a": _assignment("a")},
              )
          
              assert parsed["a"].expected_gain_signals == (
                  "new_primary",
                  "new_independent_cluster",
              )
          
          
          def test_compact_code_subclasses_preserve_fail_closed_base_contract() -> None:
          ''',
          )
          replace_once(
              "tests/test_research_candidate_assessment.py",
              '''def test_runtime_assessor_caps_two_candidate_window_at_220_tokens() -> None:
          ''',
              '''def test_runtime_assessor_accepts_explicit_diagnostic_timeout_cap() -> None:
              client = _AssessmentClient()
              assessor = RuntimeCandidateAssessor(
                  ResearchModelGateway(
                      client=client,
                      model_name="shared",
                      max_attempts=2,
                      timeout_seconds=20,
                  ),
                  timeout_cap_seconds=120.0,
              )
          
              assessor.assess(
                  run_id="diagnostic-timeout-cap",
                  claim=_claim(),
                  candidates=(_candidate("a"),),
                  assignments={"a": _assignment("a")},
                  reference_date="2026-09-05",
                  timeout_seconds=90.0,
              )
          
              assert client.calls[0]["timeout"] == 90.0
          
          
          def test_runtime_assessor_caps_two_candidate_window_at_220_tokens() -> None:
          ''',
          )

          Path("tests/test_tool_gateway_read_codes.py").write_text(
              '''from __future__ import annotations
          
          import pytest
          
          import src.web.tool_gateway as tool_gateway_module
          from src.news.article_fetcher import ArticleReadResult
          from src.web.tool_gateway import GeneralWebGateway
          
          
          class _NonGitHubReader:
              def supports(self, _url: str) -> bool:
                  return False
          
          
          @pytest.mark.parametrize(
              ("reason", "expected"),
              [
                  ("unsafe_or_empty_url", "invalid_url"),
                  ("unsafe_redirect_target", "blocked"),
                  ("non_html_resource", "unsupported"),
                  ("empty_cache_entry", "fetch_failed"),
                  ("all_backends_failed", "provider_failed"),
                  ("exception:TimeoutError:private detail", "provider_failed"),
                  ("future_reason", "other"),
              ],
          )
          def test_general_web_read_exposes_only_bounded_error_code(
              monkeypatch: pytest.MonkeyPatch,
              reason: str,
              expected: str,
          ) -> None:
              monkeypatch.setattr(
                  tool_gateway_module,
                  "fetch_article_read_result",
                  lambda *_args, **_kwargs: ArticleReadResult(
                      ok=False,
                      requested_url="https://example.com/item",
                      reason=reason,
                  ),
              )
              gateway = GeneralWebGateway(
                  github_reader=_NonGitHubReader(),
                  github_snapshotter=object(),
              )
          
              result = gateway.read("https://example.com/item")
          
              assert result["ok"] is False
              assert result["error"] == reason
              assert result["error_code"] == expected
              assert "private detail" not in result["error_code"]
          ''',
              encoding="utf-8",
          )

          Path("tests/test_rq1c_preread_diagnostic.py").write_text(
              '''from __future__ import annotations
          
          from typing import Any, cast
          
          from src.web.research.state import load_claim_engine_state
          from tools.run_rq1c_bounded_qualification_core import _active_context
          from tools.run_rq1c_preread_diagnostic import (
              DIAGNOSTIC_ASSESSOR_TIMEOUT_CAP_SECONDS,
              DIAGNOSTIC_HARD_TIMEOUT_SECONDS,
              DIAGNOSTIC_MODEL_TIMEOUT_CAP_SECONDS,
              DIAGNOSTIC_SOFT_TIMEOUT_SECONDS,
              _diagnostic_active_context,
              _diagnostic_runtime_factory,
          )
          
          
          def _state(context: dict[str, Any]):
              loaded = load_claim_engine_state(context, known_evidence_ids=())
              assert loaded.available
              assert loaded.state is not None
              return loaded.state
          
          
          def test_diagnostic_wall_clock_override_preserves_business_budgets() -> None:
              production = _state(_active_context("2026-09-05"))
              diagnostic = _state(_diagnostic_active_context("2026-09-05"))
          
              assert diagnostic.budget.max_candidates == production.budget.max_candidates == 20
              assert diagnostic.budget.max_reads == production.budget.max_reads == 8
              assert diagnostic.budget.max_total_chars == production.budget.max_total_chars == 16000
              assert production.budget.soft_timeout_seconds == 45
              assert production.budget.hard_timeout_seconds == 60
              assert diagnostic.budget.soft_timeout_seconds == DIAGNOSTIC_SOFT_TIMEOUT_SECONDS
              assert diagnostic.budget.hard_timeout_seconds == DIAGNOSTIC_HARD_TIMEOUT_SECONDS
          
          
          def test_diagnostic_runtime_uses_nonqualification_timeout_caps() -> None:
              runtime = _diagnostic_runtime_factory(
                  cast(Any, object()),
                  cast(Any, object()),
              )
          
              assert runtime.model_timeout_cap_seconds == DIAGNOSTIC_MODEL_TIMEOUT_CAP_SECONDS
              assert (
                  runtime.candidate_assessor.timeout_cap_seconds
                  == DIAGNOSTIC_ASSESSOR_TIMEOUT_CAP_SECONDS
              )
          ''',
              encoding="utf-8",
          )
          PY

      - name: Focused regression gate
        run: |
          python -m pytest -q \
            tests/test_research_candidate_assessment.py \
            tests/test_tool_gateway_read_codes.py \
            tests/test_rq1c_preread_diagnostic.py
          ruff check \
            src/web/research/candidate_assessment.py \
            src/web/research/active_semantics.py \
            src/application/active_research_runtime.py \
            src/web/tool_gateway.py \
            tools/run_rq1c_preread_diagnostic.py \
            tests/test_research_candidate_assessment.py \
            tests/test_tool_gateway_read_codes.py \
            tests/test_rq1c_preread_diagnostic.py
          python -m py_compile \
            src/web/research/candidate_assessment.py \
            src/web/research/active_semantics.py \
            src/application/active_research_runtime.py \
            src/web/tool_gateway.py \
            tools/run_rq1c_preread_diagnostic.py
          git diff --check

      - name: Commit clean implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/rq1c-p16-bounded-fix.yml
          git add src tools tests .github/workflows/rq1c-p16-bounded-fix.yml
          git diff --cached --check
          git commit -m "fix(research): isolate preread infrastructure timing"
          git push origin HEAD:codex/rq1c-bounded-qualification
