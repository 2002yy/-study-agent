name: Finalize P2-C status

on:
  push:
    branches:
      - agent/remove-news-tombstones

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-news-tombstones
          fetch-depth: 0
      - run: python tools/update_p2c_route_exit_status.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md tools/update_p2c_route_exit_status.py .github/workflows/agent-finalize-p2c-status.yml
          git commit -m "docs: record P2-C route exit baseline"
          git push origin HEAD:agent/remove-news-tombstones
