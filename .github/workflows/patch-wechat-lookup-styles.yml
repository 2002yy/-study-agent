name: Patch WeChat lookup style ownership

on:
  push:
    branches:
      - agent/remove-legacy-news-styles
    paths:
      - .github/workflows/patch-wechat-lookup-styles.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-news-styles
          fetch-depth: 0
      - name: Rename active WeChat lookup styles and self-clean
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          panel_path = Path("frontend/src/features/wechat-workspace/WechatPanel.tsx")
          panel = panel_path.read_text(encoding="utf-8")
          replacements = {
              "function newsItemUrl(": "function lookupItemUrl(",
              "function newsItemStatus(": "function lookupItemStatus(",
              "function NewsItemCard(": "function LookupItemCard(",
              "const url = newsItemUrl(item);": "const url = lookupItemUrl(item);",
              "{newsItemStatus(item)}": "{lookupItemStatus(item)}",
              'className="news-item"': 'className="wechat-lookup-item"',
              'className="news-result lookup-result"': 'className="wechat-lookup-result lookup-result"',
              'className="news-list"': 'className="wechat-lookup-list"',
              "<NewsItemCard ": "<LookupItemCard ",
          }
          for old, new in replacements.items():
              count = panel.count(old)
              if count != 1:
                  raise SystemExit(f"expected one panel match for {old!r}, found {count}")
              panel = panel.replace(old, new)
          if 'className="news-' in panel:
              raise SystemExit("retired NewsWorkspace class remains in WechatPanel")
          panel_path.write_text(panel, encoding="utf-8")

          styles_path = Path("frontend/src/styles.css")
          styles = styles_path.read_text(encoding="utf-8")
          pre_old = ".wechat-thread pre {"
          pre_new = ".wechat-thread pre,\n.wechat-lookup-result pre {"
          if styles.count(pre_old) != 1:
              raise SystemExit(f"expected one WeChat pre owner, found {styles.count(pre_old)}")
          styles = styles.replace(pre_old, pre_new)

          anchor = "\n\n.lookup-result {"
          if styles.count(anchor) != 1:
              raise SystemExit(f"expected one lookup-result anchor, found {styles.count(anchor)}")
          owned = """

.wechat-lookup-result {
  display: grid;
  gap: 10px;
  margin-top: 12px;
}

.wechat-lookup-list {
  display: grid;
  gap: 8px;
  margin-top: 8px;
}

.wechat-lookup-item {
  display: grid;
  gap: 3px;
  padding: 9px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
}

.wechat-lookup-item strong,
.wechat-lookup-item a,
.wechat-lookup-item span {
  min-width: 0;
  overflow-wrap: anywhere;
}

.wechat-lookup-item a {
  color: var(--accent-strong);
  font-weight: 800;
}

.wechat-lookup-item span {
  color: var(--muted);
  font-size: 12px;
}

.wechat-lookup-item small {
  color: #52646c;
  font-size: 11px;
  line-height: 1.4;
}
"""
          styles = styles.replace(anchor, owned + anchor)
          if ".news-" in styles:
              raise SystemExit("retired .news-* selector remains in styles")
          styles_path.write_text(styles, encoding="utf-8")
          PY
          rm .github/workflows/patch-wechat-lookup-styles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/styles.css frontend/src/features/wechat-workspace/WechatPanel.tsx .github/workflows/patch-wechat-lookup-styles.yml
          git commit -m "style: move lookup styles to WeChat owner"
          git push origin HEAD:agent/remove-legacy-news-styles
