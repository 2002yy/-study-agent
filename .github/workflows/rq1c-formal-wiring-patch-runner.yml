name: RQ1-C Formal Wiring Patch Runner

on:
  push:
    branches: [codex/rq1c-bounded-qualification]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'ci: stage rq1c formal live12 wiring patch' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/rq1c-bounded-qualification
          fetch-depth: 0
      - name: Patch formal live12 wiring only
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/rq1c-live-qualification.yml')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '      RESEARCH_CANDIDATE_ASSESSOR_BASE_URL: http://127.0.0.1:8001/v1\n'
                  '      RESEARCH_CANDIDATE_ASSESSOR_MODEL_NAME: rq1c-qwen25-15b-instruct-q4km\n'
                  '      RESEARCH_CANDIDATE_ASSESSOR_API_KEY: local\n',
                  '      RESEARCH_CANDIDATE_ASSESSOR_BASE_URL: http://127.0.0.1:8000/v1\n'
                  '      RESEARCH_CANDIDATE_ASSESSOR_MODEL_NAME: rq1c-qwen3-4b-instruct-2507-q4km\n'
                  '      RESEARCH_CANDIDATE_ASSESSOR_API_KEY: local\n'
                  "      RQ1C_HOSTED_CPU_WALLCLOCK_EXEMPT: 'true'\n",
              ),
              (
                  "              'candidate_assessor_timeout_seconds': 15,\n",
                  "              'candidate_assessor_product_timeout_seconds': 15,\n"
                  "              'qualification_hosted_cpu_model_timeout_cap_seconds': 120,\n"
                  "              'product_soft_timeout_seconds': 45,\n"
                  "              'product_hard_timeout_seconds': 60,\n"
                  "              'qualification_hosted_cpu_soft_timeout_seconds': 240,\n"
                  "              'qualification_hosted_cpu_hard_timeout_seconds': 300,\n"
                  "              'hosted_cpu_wallclock_exempt': (\n"
                  "                  os.environ.get('RQ1C_HOSTED_CPU_WALLCLOCK_EXEMPT') == 'true'\n"
                  "              ),\n"
                  "              'hosted_cpu_wallclock_exempt_reason': 'github_hosted_local_model_cpu',\n",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one patch anchor, got {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Verify bounded workflow diff
        shell: bash
        run: |
          set -euo pipefail
          grep -F "RESEARCH_CANDIDATE_ASSESSOR_BASE_URL: http://127.0.0.1:8000/v1" .github/workflows/rq1c-live-qualification.yml
          grep -F "RESEARCH_CANDIDATE_ASSESSOR_MODEL_NAME: rq1c-qwen3-4b-instruct-2507-q4km" .github/workflows/rq1c-live-qualification.yml
          grep -F "RQ1C_HOSTED_CPU_WALLCLOCK_EXEMPT: 'true'" .github/workflows/rq1c-live-qualification.yml
          grep -F "'candidate_assessor_product_timeout_seconds': 15" .github/workflows/rq1c-live-qualification.yml
          grep -F "'qualification_hosted_cpu_model_timeout_cap_seconds': 120" .github/workflows/rq1c-live-qualification.yml
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = ".github/workflows/rq1c-live-qualification.yml"
      - name: Commit formal workflow wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/rq1c-live-qualification.yml
          git commit -m 'ci(qualification): use 4b assessor on hosted live12'
          git push origin HEAD:codex/rq1c-bounded-qualification
