name: Apply P2-C News model exit

on:
  push:
    branches:
      - agent/remove-legacy-news-models
    paths:
      - .github/workflows/agent-p2c-news-model-exit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-news-models
      - name: Apply exact patch
        run: python tools/remove_legacy_news_models.py
      - name: Remove temporary patch files and commit
        run: |
          git rm tools/remove_legacy_news_models.py .github/workflows/agent-p2c-news-model-exit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api/models/news.py src/api/models/__init__.py src/api/__init__.py src/application/helpers.py
          git commit -m "remove legacy News API model compatibility"
          git push origin HEAD:agent/remove-legacy-news-models
