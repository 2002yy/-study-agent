name: Finalize P2-C extension drawer status
on:
  push:
    branches: [agent/remove-legacy-extension-drawers]
    paths:
      - .github/workflows/agent-p2c-extension-status.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-extension-drawers
          fetch-depth: 0
      - name: Update project status
        shell: python
        run: |
          from pathlib import Path

          p = Path("docs/PROJECT_STATUS.md")
          text = p.read_text(encoding="utf-8")

          old = '> 当前切片：**PR #113 已 squash 合并 `main`；最终 head `bc3c06f043eae5f195516741c88a45205e21864b` 的 CI run `31177513884` 完整通过，功能 merge SHA `39e5efe91a75099b6cf5646aa9060d2945b5604c`。**  '
          new = '> 当前切片：**Draft PR #114 已退出旧 `group / tools / timeline` drawer surface 兼容适配；最终代码 head `c65189c9c38e9b09abd11803d875a10e22b47a58`，CI run `31179908482` 完整通过。P2-C 兼容层退出已完成代码与回归基线。**  '
          if old not in text:
              raise SystemExit("top current-slice anchor missing")
          text = text.replace(old, new, 1)

          old = '> 下一主线：**P2-C 第三切片盘点并退出无 owner 的旧 `group / tools / timeline` 新 UI adapter；只在实验室现役恢复与调用链证明无依赖后删除。**  '
          new = '> 下一主线：**P2-D 源码学习与验证增强：GitHub symbol mapping + CI association、Firefox / WebKit 抽样，以及实体手机输入法、滚动、drawer、实验室与恢复验证。**  '
          if old not in text:
              raise SystemExit("top next-mainline anchor missing")
          text = text.replace(old, new, 1)

          anchor = '- `NewsRun* / NewsLookup* / ResearchRun* / WebLookupRun*` 现役合同、durable `/news/runs*`、SQLite NewsRun 与恢复语义保持不变。\n'
          addition = '''- `NewsRun* / NewsLookup* / ResearchRun* / WebLookupRun*` 现役合同、durable `/news/runs*`、SQLite NewsRun 与恢复语义保持不变。\n- PR #114：旧 Extension drawer surface 兼容适配退出；\n- 审计确认 `group / tools / timeline` 仍是现役实验能力 ID 与 controller owner，不能删除；真正无 owner 的是旧 drawer surface 恢复适配。`WorkspacePersistence` 不持久化 `activeDrawer`，新 UI 只打开 `lab`；\n- 有效红边界 commit `4a3e6138f7dbafb9a834ad3a8fdb232bae9ab785`，CI run `31179197610`：274 项通过、2 项按预期失败，且“现役 controller 必须保留”边界通过；\n- 实现后 run `31179428611` 发现旧 `useExtensionRuntimeBoundary.test.ts` 仍断言 `EXTENSION_DRAWERS`；同步改为 capability 合同；\n- head `a8f2533d945d182ee545cac2ac41625b2b5547e4` / run `31179663893` 中 276 个 Vitest 已全部通过，但 TypeScript build 进一步抓到 reducer 测试仍把 `"group"` 当作 `DrawerId`；改为真实 `lab` surface，不使用 cast 绕过类型；\n- 最终代码 head `c65189c9c38e9b09abd11803d875a10e22b47a58`，CI run `31179908482` 完整通过；\n- `DrawerId` 现只包含普通 drawer 与 `lab`；`group / tools / timeline` 只属于 `ExtensionCapabilityId`。`useGroupChatController / useToolController / useWorkflowController`、ExtensionRuntime 恢复端口和按需加载继续保留。\n'''
          if anchor not in text:
              raise SystemExit("section 2.6 anchor missing")
          text = text.replace(anchor, addition, 1)

          old = '''3. 下一切片盘点旧 `group / tools / timeline` 新 UI adapter 的恢复、持久化和调用来源；\n4. 只有在实验室入口、ExtensionRuntime 恢复和选择性加载均证明无依赖后，才删除无 owner adapter；\n5. 每个删除切片继续保持 API、持久化、普通模式和真实浏览器闭环不变。'''
          new = '''3. PR #114 已证明旧 `group / tools / timeline` drawer surface 无持久化或新 UI owner，并退出该兼容适配；\n4. `group / tools / timeline` 继续作为实验能力 ID，由 ExtensionRuntime 的 group / tool / workflow controller 拥有，实验室入口仍默认休眠并按需加载；\n5. P2-C 三个删除切片均保持 API、WorkspacePersistence、普通模式、Chromium Golden Journeys 与真实 FastAPI + SQLite 闭环不变，兼容层退出阶段完成。'''
          if old not in text:
              raise SystemExit("section 8 P2-C anchor missing")
          text = text.replace(old, new, 1)

          old = 'P2-C 第二切片已完成代码与回归基线：'
          new = 'P2-C 三个切片已完成代码与回归基线，兼容层退出阶段收口：'
          if old not in text:
              raise SystemExit("section 9 heading anchor missing")
          text = text.replace(old, new, 1)

          tail_anchor = '- durable `/news/runs*`、SQLite NewsRun、恢复语义、前端和真实浏览器闭环均未回归。\n\nPR #113 已合并 `main`；P2-C 第二切片完成，当前进入第三切片：`group / tools / timeline` adapter owner、恢复、持久化与选择性加载边界审计。'
          tail_new = '''- durable `/news/runs*`、SQLite NewsRun、恢复语义、前端和真实浏览器闭环均未回归；\n- 旧 Extension capability drawer surface 已退出，`lab` 成为唯一实验 drawer；\n- group / tool / workflow controller、恢复端口和按需加载继续由 ExtensionRuntime 拥有；\n- 最终代码基线 `c65189c9c38e9b09abd11803d875a10e22b47a58` / CI `31179908482` 完整通过。\n\nPR #114 状态同步 CI 通过后即可合并；合并后 P2-C 结束，进入 P2-D 源码学习与验证增强。'''
          if tail_anchor not in text:
              raise SystemExit("section 9 tail anchor missing")
          text = text.replace(tail_anchor, tail_new, 1)

          p.write_text(text, encoding="utf-8")
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/agent-p2c-extension-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "finalize P2-C extension drawer status"
          git push origin HEAD:agent/remove-legacy-extension-drawers
