name: RQ1-C Hosted Slot Benchmark

on:
  push:
    branches:
      - codex/rq1c-bounded-qualification

permissions:
  contents: read

jobs:
  slot-benchmark:
    if: "${{ github.event.head_commit.message == 'rq1c-hosted-slot-benchmark' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LLAMA_CPP_TAG: b10809
      LLAMA_CPP_ARCHIVE_SHA256: 5e34434ddc6d03cd1584f403201aff0d4bd1a5793a72ff7e286532dfd1e4b941
      HF_MODEL_REPO: unsloth/Qwen3-4B-Instruct-2507-GGUF
      HF_MODEL_FILE: Qwen3-4B-Instruct-2507-Q4_K_M.gguf
      MODEL_SHA256_EXPECTED: 3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597
      MODEL_ALIAS: rq1c-qwen3-4b-instruct-2507-q4km

    steps:
      - name: Check out diagnostic head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned llama.cpp CPU server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local-llama .local-model output
          archive=.local-llama/llama.tar.gz
          curl -fL --retry 4 --retry-delay 2 \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_TAG}/llama-${LLAMA_CPP_TAG}-bin-ubuntu-x64.tar.gz" \
            -o "$archive"
          echo "${LLAMA_CPP_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C .local-llama
          server="$(find .local-llama -type f -name llama-server -print -quit)"
          test -n "$server"
          chmod +x "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
          "$server" --version > output/llama-server-version.log 2>&1 || true

      - name: Download exact formal Qwen3 4B GGUF
        shell: bash
        run: |
          set -euo pipefail
          model=.local-model/${HF_MODEL_FILE}
          curl -fL --retry 5 --retry-delay 3 \
            "https://huggingface.co/${HF_MODEL_REPO}/resolve/main/${HF_MODEL_FILE}?download=true" \
            -o "$model"
          test -s "$model"
          model_sha="$(sha256sum "$model" | awk '{print $1}')"
          test "$model_sha" = "$MODEL_SHA256_EXPECTED"
          echo "MODEL_PATH=$model" >> "$GITHUB_ENV"
          printf '%s  %s\n' "$model_sha" "$HF_MODEL_FILE" > output/model-sha256.txt

      - name: Write synthetic production-shaped prompt
        shell: python
        run: |
          import json
          from pathlib import Path

          evidence = (
              "研究证据片段：系统必须区分候选、成功读取、可用证据和最终主张；"
              "当证据不足时必须保留不确定性；不能把未读取摘要升级为正式证据。"
          ) * 72
          payload = {
              "model": "rq1c-qwen3-4b-instruct-2507-q4km",
              "messages": [
                  {
                      "role": "system",
                      "content": (
                          "你是学习助手。基于给定材料写出结构清晰、具体、谨慎的中文回答；"
                          "不要省略关键限制。"
                      ),
                  },
                  {
                      "role": "user",
                      "content": (
                          evidence
                          + "\n请给出一份详细分析，至少包含十二个有解释的要点，"
                          "并在最后总结风险与边界。请充分展开。"
                      ),
                  },
              ],
              "temperature": 0,
              "max_tokens": 512,
              "stream": False,
          }
          Path("output/request.json").write_text(
              json.dumps(payload, ensure_ascii=False), encoding="utf-8"
          )

      - name: Benchmark current auto-slot server
        shell: bash
        run: |
          set -euo pipefail
          "$LLAMA_SERVER" \
            -m "$MODEL_PATH" \
            --alias "$MODEL_ALIAS" \
            --host 127.0.0.1 \
            --port 8000 \
            -c 8192 \
            -t "$(nproc)" \
            --jinja \
            > output/auto-server.log 2>&1 &
          pid=$!
          echo "$pid" > output/auto-server.pid
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi
            kill -0 "$pid" 2>/dev/null || { cat output/auto-server.log >&2; exit 1; }
            sleep 2
          done
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          body = Path('output/request.json').read_bytes()
          req = urllib.request.Request(
              'http://127.0.0.1:8000/v1/chat/completions',
              data=body,
              headers={'Content-Type': 'application/json', 'Authorization': 'Bearer local'},
              method='POST',
          )
          started = time.monotonic()
          with urllib.request.urlopen(req, timeout=180) as response:
              parsed = json.loads(response.read())
          elapsed = time.monotonic() - started
          usage = parsed.get('usage') or {}
          record = {
              'mode': 'auto_slots',
              'elapsed_seconds': round(elapsed, 6),
              'prompt_tokens': usage.get('prompt_tokens'),
              'completion_tokens': usage.get('completion_tokens'),
              'total_tokens': usage.get('total_tokens'),
              'finish_reason': ((parsed.get('choices') or [{}])[0]).get('finish_reason'),
              'cpu_count': __import__('os').cpu_count(),
          }
          Path('output/auto-result.json').write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')
          print(json.dumps(record, sort_keys=True))
          if int(record.get('completion_tokens') or 0) < 450:
              raise SystemExit(f'auto benchmark did not generate enough tokens: {record}')
          PY
          cleanup
          trap - EXIT

      - name: Benchmark forced single-slot unified-KV server
        shell: bash
        run: |
          set -euo pipefail
          "$LLAMA_SERVER" \
            -m "$MODEL_PATH" \
            --alias "$MODEL_ALIAS" \
            --host 127.0.0.1 \
            --port 8000 \
            -c 8192 \
            -t "$(nproc)" \
            -np 1 \
            -kvu \
            --jinja \
            > output/single-server.log 2>&1 &
          pid=$!
          echo "$pid" > output/single-server.pid
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi
            kill -0 "$pid" 2>/dev/null || { cat output/single-server.log >&2; exit 1; }
            sleep 2
          done
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          body = Path('output/request.json').read_bytes()
          req = urllib.request.Request(
              'http://127.0.0.1:8000/v1/chat/completions',
              data=body,
              headers={'Content-Type': 'application/json', 'Authorization': 'Bearer local'},
              method='POST',
          )
          started = time.monotonic()
          with urllib.request.urlopen(req, timeout=180) as response:
              parsed = json.loads(response.read())
          elapsed = time.monotonic() - started
          usage = parsed.get('usage') or {}
          record = {
              'mode': 'single_slot_unified_kv',
              'elapsed_seconds': round(elapsed, 6),
              'prompt_tokens': usage.get('prompt_tokens'),
              'completion_tokens': usage.get('completion_tokens'),
              'total_tokens': usage.get('total_tokens'),
              'finish_reason': ((parsed.get('choices') or [{}])[0]).get('finish_reason'),
              'cpu_count': __import__('os').cpu_count(),
          }
          Path('output/single-result.json').write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')
          print(json.dumps(record, sort_keys=True))
          if int(record.get('completion_tokens') or 0) < 450:
              raise SystemExit(f'single-slot benchmark did not generate enough tokens: {record}')
          PY
          cleanup
          trap - EXIT

      - name: Write comparison summary
        shell: python
        run: |
          import json, re
          from pathlib import Path

          auto = json.loads(Path('output/auto-result.json').read_text())
          single = json.loads(Path('output/single-result.json').read_text())
          def startup(path):
              text = Path(path).read_text(errors='replace')
              match = re.search(r"initializing, n_slots = (\d+), n_ctx_slot = (\d+), kv_unified = '([^']+)'", text)
              if not match:
                  return {'n_slots': None, 'n_ctx_slot': None, 'kv_unified': None}
              return {
                  'n_slots': int(match.group(1)),
                  'n_ctx_slot': int(match.group(2)),
                  'kv_unified': match.group(3),
              }
          ratio = auto['elapsed_seconds'] / single['elapsed_seconds'] if single['elapsed_seconds'] else None
          summary = {
              'git_sha': __import__('os').environ['GITHUB_SHA'],
              'model_sha256': __import__('os').environ['MODEL_SHA256_EXPECTED'],
              'auto': {**auto, **startup('output/auto-server.log')},
              'single': {**single, **startup('output/single-server.log')},
              'auto_elapsed_over_single_elapsed': round(ratio, 6) if ratio else None,
              'response_text_stored': False,
          }
          Path('output/slot-benchmark-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, sort_keys=True))

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: rq1c-hosted-slot-benchmark
          path: |
            output/slot-benchmark-summary.json
            output/auto-result.json
            output/single-result.json
            output/auto-server.log
            output/single-server.log
            output/llama-server-version.log
            output/model-sha256.txt
          retention-days: 14
