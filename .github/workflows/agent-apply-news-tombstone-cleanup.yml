name: Apply news tombstone cleanup

on:
  push:
    branches:
      - agent/remove-news-tombstones

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-news-tombstones
          fetch-depth: 0

      - name: Remove obsolete 410 test and temporary workflow
        shell: python
        run: |
          from pathlib import Path

          test_path = Path("tests/test_api.py")
          source = test_path.read_text(encoding="utf-8")
          obsolete = '''def test_legacy_news_round_routes_are_gone_without_running_legacy_flow(
              monkeypatch, runtime_test_context
          ):
              from src import api

              def fail_legacy(*args, **kwargs):
                  raise AssertionError("legacy flow must not run")

              monkeypatch.setattr(
                  api,
                  "run_news_round",
                  fail_legacy,
              )
              client = TestClient(app)
              payload = {"query": "OpenAI latest"}
              group_file = runtime_test_context.group_service.importer.group_file

              assert client.post("/news/round", json=payload).status_code == 410
              assert client.post("/wechat/news-round", json=payload).status_code == 410
              assert client.post("/news/search", json=payload).status_code == 410
              assert client.post(
                  "/news/enrich", json={"news_items": [{"title": "A"}]}
              ).status_code == 410
              assert client.post(
                  "/news/digest", json={"news_items": [{"title": "A"}]}
              ).status_code == 410
              assert client.post("/news/discuss", json={"digest": "old"}).status_code == 410
              assert not group_file.exists()


          '''
          if source.count(obsolete) != 1:
              raise SystemExit("obsolete 410 test block was not found exactly once")
          test_path.write_text(source.replace(obsolete, ""), encoding="utf-8")
          Path(".github/workflows/agent-apply-news-tombstone-cleanup.yml").unlink()

      - name: Commit exact test migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_api.py .github/workflows/agent-apply-news-tombstone-cleanup.yml
          git commit -m "remove obsolete news tombstone test"
          git push origin HEAD:agent/remove-news-tombstones
