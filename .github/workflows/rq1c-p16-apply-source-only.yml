name: RQ1C P16 source-only apply

on:
  push:
    branches:
      - codex/rq1c-bounded-qualification

permissions:
  contents: write

jobs:
  apply-and-test:
    if: contains(github.event.head_commit.message, '[rq1c-p16-source-only]')
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/rq1c-bounded-qualification
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 5 --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt --disable-pip-version-check --timeout 30 --retries 5

      - name: Apply reviewed v3 source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          diagnostic = Path("tools/run_rq1c_preread_diagnostic.py")
          text = diagnostic.read_text(encoding="utf-8")
          old = (
              '            "max_reads": 8,\n'
              '            "soft_timeout_seconds": 45,\n'
              '            "hard_timeout_seconds": 60,\n'
          )
          new = (
              '            "max_reads": 8,\n'
              '        "soft_timeout_seconds": 45,\n'
              '        "hard_timeout_seconds": 60,\n'
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected diagnostic configured-budget source anchor")
          diagnostic.write_text(text.replace(old, new, 1), encoding="utf-8")

          preread_tests = Path("tests/test_rq1c_preread_diagnostic.py")
          existing_preread_tests = preread_tests.read_text(encoding="utf-8")

          workflow = Path(".github/workflows/rq1c-p16-bounded-fix-v3.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = workflow_text.index(marker) + len(marker)
          end = workflow_text.index("\n          PY", start)
          block = workflow_text[start:end]
          source = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          exec(compile(source, "rq1c-p16-v3-reviewed-patch", "exec"), {})

          # v3 originally wrote a timing-only preread test file. Preserve the
          # already-landed live14 privacy/classification regressions and append
          # the new diagnostic timing-isolation tests instead of replacing them.
          body_marker = "def test_assessment_summary_exposes_counts_without_candidate_identity()"
          body_start = existing_preread_tests.index(body_marker)
          existing_body = existing_preread_tests[body_start:].rstrip()
          merged = '''from __future__ import annotations

from typing import Any, cast

import pytest

from src.web.research.state import load_claim_engine_state
from tools.run_rq1c_bounded_qualification_core import _active_context
from tools.run_rq1c_preread_diagnostic import (
    DIAGNOSTIC_ASSESSOR_TIMEOUT_CAP_SECONDS,
    DIAGNOSTIC_HARD_TIMEOUT_SECONDS,
    DIAGNOSTIC_MODEL_TIMEOUT_CAP_SECONDS,
    DIAGNOSTIC_SOFT_TIMEOUT_SECONDS,
    _DiagnosticReadGateway,
    _assessment_summary,
    _assessor_failure_summary,
    _diagnostic_active_context,
    _diagnostic_runtime_factory,
    _read_failure_summary,
)


''' + existing_body + '''


def _state(context: dict[str, Any]):
    loaded = load_claim_engine_state(context, known_evidence_ids=())
    assert loaded.available
    assert loaded.state is not None
    return loaded.state


def test_diagnostic_wall_clock_override_preserves_business_budgets() -> None:
    production = _state(_active_context("2026-09-05"))
    diagnostic = _state(_diagnostic_active_context("2026-09-05"))
    assert diagnostic.budget.max_candidates == production.budget.max_candidates == 20
    assert diagnostic.budget.max_reads == production.budget.max_reads == 8
    assert diagnostic.budget.max_total_chars == production.budget.max_total_chars == 16000
    assert production.budget.soft_timeout_seconds == 45
    assert production.budget.hard_timeout_seconds == 60
    assert diagnostic.budget.soft_timeout_seconds == DIAGNOSTIC_SOFT_TIMEOUT_SECONDS
    assert diagnostic.budget.hard_timeout_seconds == DIAGNOSTIC_HARD_TIMEOUT_SECONDS


def test_diagnostic_runtime_uses_nonqualification_timeout_caps() -> None:
    runtime = _diagnostic_runtime_factory(
        cast(Any, object()),
        cast(Any, object()),
    )
    assert runtime.model_timeout_cap_seconds == DIAGNOSTIC_MODEL_TIMEOUT_CAP_SECONDS
    assert (
        runtime.candidate_assessor.timeout_cap_seconds
        == DIAGNOSTIC_ASSESSOR_TIMEOUT_CAP_SECONDS
    )
    assert runtime.claim_planner.model_gateway._timeout_seconds == (  # noqa: SLF001
        DIAGNOSTIC_MODEL_TIMEOUT_CAP_SECONDS
    )
'''
          preread_tests.write_text(merged, encoding="utf-8")
          PY

      - name: Focused regression gate
        run: |
          python -m pytest \
            tests/test_research_candidate_assessment.py \
            tests/test_tool_gateway_read_codes.py \
            tests/test_rq1c_preread_diagnostic.py \
            tests/test_active_research_runtime.py \
            tests/test_research_dispatch.py -q
          ruff check \
            src/web/research/candidate_assessment.py \
            src/web/research/active_semantics.py \
            src/application/active_research_runtime.py \
            src/web/tool_gateway.py \
            tools/run_rq1c_preread_diagnostic.py \
            tests/test_research_candidate_assessment.py \
            tests/test_tool_gateway_read_codes.py \
            tests/test_rq1c_preread_diagnostic.py \
            tests/test_active_research_runtime.py \
            tests/test_research_dispatch.py
          python -m py_compile \
            src/web/research/candidate_assessment.py \
            src/web/research/active_semantics.py \
            src/application/active_research_runtime.py \
            src/web/tool_gateway.py \
            tools/run_rq1c_preread_diagnostic.py
          git diff --check

      - name: Commit source-only implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tools tests
          git diff --cached --check
          git commit -m "fix(research): isolate preread infrastructure timing"
          git push origin HEAD:codex/rq1c-bounded-qualification
