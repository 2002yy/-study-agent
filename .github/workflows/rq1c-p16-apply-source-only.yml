name: RQ1C P16 source-only apply

on:
  push:
    branches:
      - codex/rq1c-bounded-qualification

permissions:
  contents: write

jobs:
  apply-and-test:
    if: contains(github.event.head_commit.message, '[rq1c-p16-source-only]')
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/rq1c-bounded-qualification
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 5 --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt --disable-pip-version-check --timeout 30 --retries 5

      - name: Apply reviewed v3 source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          diagnostic = Path("tools/run_rq1c_preread_diagnostic.py")
          text = diagnostic.read_text(encoding="utf-8")
          old = (
              '            "max_reads": 8,\n'
              '            "soft_timeout_seconds": 45,\n'
              '            "hard_timeout_seconds": 60,\n'
          )
          new = (
              '            "max_reads": 8,\n'
              '        "soft_timeout_seconds": 45,\n'
              '        "hard_timeout_seconds": 60,\n'
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected diagnostic configured-budget source anchor")
          diagnostic.write_text(text.replace(old, new, 1), encoding="utf-8")

          preread_tests = Path("tests/test_rq1c_preread_diagnostic.py")
          existing_preread_tests = preread_tests.read_text(encoding="utf-8")

          workflow = Path(".github/workflows/rq1c-p16-bounded-fix-v3.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = workflow_text.index(marker) + len(marker)
          end = workflow_text.index("\n          PY", start)
          block = workflow_text[start:end]
          source = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          exec(compile(source, "rq1c-p16-v3-reviewed-patch", "exec"), {})

          generated_preread_tests = preread_tests.read_text(encoding="utf-8")
          timing_start = generated_preread_tests.index("def _state(")
          timing_body = generated_preread_tests[timing_start:].lstrip()
          merged = existing_preread_tests
          merged = merged.replace(
              "from __future__ import annotations\n\n",
              "from __future__ import annotations\n\nfrom typing import Any, cast\n\n",
              1,
          )
          merged = merged.replace(
              "import pytest\n\n",
              "import pytest\n\n"
              "from src.web.research.state import load_claim_engine_state\n"
              "from tools.run_rq1c_bounded_qualification_core import _active_context\n",
              1,
          )
          merged = merged.replace(
              "from tools.run_rq1c_preread_diagnostic import (\n",
              "from tools.run_rq1c_preread_diagnostic import (\n"
              "    DIAGNOSTIC_ASSESSOR_TIMEOUT_CAP_SECONDS,\n"
              "    DIAGNOSTIC_HARD_TIMEOUT_SECONDS,\n"
              "    DIAGNOSTIC_MODEL_TIMEOUT_CAP_SECONDS,\n"
              "    DIAGNOSTIC_SOFT_TIMEOUT_SECONDS,\n"
              "    _diagnostic_active_context,\n"
              "    _diagnostic_runtime_factory,\n",
              1,
          )
          preread_tests.write_text(
              merged.rstrip() + "\n\n\n" + timing_body,
              encoding="utf-8",
          )
          PY

      - name: Focused regression gate
        run: |
          python -m pytest \
            tests/test_research_candidate_assessment.py \
            tests/test_tool_gateway_read_codes.py \
            tests/test_rq1c_preread_diagnostic.py \
            tests/test_active_research_runtime.py -q
          ruff check \
            src/web/research/candidate_assessment.py \
            src/web/research/active_semantics.py \
            src/application/active_research_runtime.py \
            src/web/tool_gateway.py \
            tools/run_rq1c_preread_diagnostic.py \
            tests/test_research_candidate_assessment.py \
            tests/test_tool_gateway_read_codes.py \
            tests/test_rq1c_preread_diagnostic.py \
            tests/test_active_research_runtime.py
          python -m py_compile \
            src/web/research/candidate_assessment.py \
            src/web/research/active_semantics.py \
            src/application/active_research_runtime.py \
            src/web/tool_gateway.py \
            tools/run_rq1c_preread_diagnostic.py
          git diff --check

      - name: Commit source-only implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tools tests
          git diff --cached --check
          git commit -m "fix(research): isolate preread infrastructure timing"
          git push origin HEAD:codex/rq1c-bounded-qualification
