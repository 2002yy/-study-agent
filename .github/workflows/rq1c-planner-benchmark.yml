name: RQ1-C Planner Benchmark

on:
  push:
    branches:
      - codex/rq1c-bounded-qualification

permissions:
  contents: read

concurrency:
  group: rq1c-planner-benchmark
  cancel-in-progress: false

jobs:
  planner-benchmark:
    if: "${{ github.event.head_commit.message == 'rq1c-planner-benchmark-local-qwen4b' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      LLAMA_CPP_TAG: b10809
      LLAMA_CPP_ARCHIVE_SHA256: 5e34434ddc6d03cd1584f403201aff0d4bd1a5793a72ff7e286532dfd1e4b941
      HF_MODEL_REPO: unsloth/Qwen3-4B-Instruct-2507-GGUF
      HF_MODEL_FILE: Qwen3-4B-Instruct-2507-Q4_K_M.gguf
      MODEL_SHA256_EXPECTED: 3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597
      MODEL_ALIAS: rq1c-qwen3-4b-instruct-2507-q4km

    steps:
      - name: Check out exact benchmark head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Study Agent dependencies
        run: pip install -r requirements.txt

      - name: Install pinned llama.cpp CPU server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local-llama output
          archive=.local-llama/llama.tar.gz
          curl -fL --retry 4 --retry-delay 2 \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_TAG}/llama-${LLAMA_CPP_TAG}-bin-ubuntu-x64.tar.gz" \
            -o "$archive"
          echo "${LLAMA_CPP_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C .local-llama
          server="$(find .local-llama -type f -name llama-server -print -quit)"
          test -n "$server"
          chmod +x "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
          "$server" --version | tee output/llama-server-version.log

      - name: Download pinned Qwen3 4B GGUF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local-model output
          model=.local-model/${HF_MODEL_FILE}
          curl -fL --retry 5 --retry-delay 3 \
            "https://huggingface.co/${HF_MODEL_REPO}/resolve/main/${HF_MODEL_FILE}?download=true" \
            -o "$model"
          test -s "$model"
          actual="$(sha256sum "$model" | awk '{print $1}')"
          test "$actual" = "$MODEL_SHA256_EXPECTED"
          echo "MODEL_PATH=$model" >> "$GITHUB_ENV"
          printf '%s  %s\n' "$actual" "$HF_MODEL_FILE" | tee output/model-sha256.txt

      - name: Start local OpenAI-compatible server
        shell: bash
        run: |
          set -euo pipefail
          "$LLAMA_SERVER" \
            -m "$MODEL_PATH" \
            --alias "$MODEL_ALIAS" \
            --host 127.0.0.1 \
            --port 8000 \
            -c 8192 \
            -t "$(nproc)" \
            --jinja \
            > output/llama-server.log 2>&1 &
          echo $! > output/llama-server.pid
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/health > output/llama-health.json 2>/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat output/llama-server.pid)" 2>/dev/null; then
              cat output/llama-server.log >&2
              exit 1
            fi
            sleep 2
          done
          cat output/llama-server.log >&2
          exit 1

      - name: Benchmark claim-planner prompt and output caps
        shell: python
        run: |
          import json
          import time
          from pathlib import Path
          from openai import OpenAI
          from src.web.research.claim_planner import (
              _CLAIM_SYSTEM_PROMPT,
              _claim_user_payload,
              _parse_claim_plan,
          )

          client = OpenAI(
              api_key='local',
              base_url='http://127.0.0.1:8000/v1',
              timeout=30,
              max_retries=0,
          )
          questions = [
              (
                  'current_policy',
                  "According to Docker's current official documentation, what pull-rate limits apply to unauthenticated users and authenticated Personal users on Docker Hub?",
              ),
              (
                  'causal_complex',
                  "According to Cloudflare's primary postmortem and independent technical reporting, what directly triggered the June 12, 2025 Cloudflare outage, and what contributing factors made the incident broader or harder to recover from?",
              ),
              (
                  'unverifiable',
                  'Which exact vulnerabilities will be fixed in the next Python security release before the Python Security Response Team publicly announces them?',
              ),
          ]
          tightened = _CLAIM_SYSTEM_PROMPT + (
              '\nUse the fewest claims needed to answer the question, normally one to three. '
              'Keep each claim surface concise (at most 160 characters). Do not restate the same fact.'
          )
          variants = [
              ('current_256', _CLAIM_SYSTEM_PROMPT, 256),
              ('tight_256', tightened, 256),
              ('tight_320', tightened, 320),
          ]
          records = []
          for question_name, question in questions:
              payload = _claim_user_payload(
                  {
                      'question': question,
                      'reference_date': '2026-09-05',
                      'freshness_requested': False,
                      'freshness_days': None,
                  }
              )
              for variant_name, system_prompt, cap in variants:
                  started = time.monotonic()
                  response = client.chat.completions.create(
                      model='rq1c-qwen3-4b-instruct-2507-q4km',
                      messages=[
                          {'role': 'system', 'content': system_prompt},
                          {'role': 'user', 'content': payload},
                      ],
                      temperature=0,
                      max_tokens=cap,
                      response_format={'type': 'json_object'},
                  )
                  elapsed = time.monotonic() - started
                  text = response.choices[0].message.content or ''
                  record = {
                      'question': question_name,
                      'variant': variant_name,
                      'cap': cap,
                      'elapsed_seconds': round(elapsed, 6),
                      'finish_reason': response.choices[0].finish_reason,
                      'prompt_tokens': getattr(response.usage, 'prompt_tokens', None),
                      'completion_tokens': getattr(response.usage, 'completion_tokens', None),
                      'total_tokens': getattr(response.usage, 'total_tokens', None),
                      'json_valid': False,
                      'parser_valid': False,
                      'claims_count': None,
                      'surfaces': [],
                      'error': '',
                  }
                  try:
                      parsed = json.loads(text)
                      record['json_valid'] = True
                      proposals = _parse_claim_plan(parsed)
                      record['parser_valid'] = True
                      record['claims_count'] = len(proposals)
                      record['surfaces'] = [item.surface for item in proposals]
                  except Exception as exc:
                      record['error'] = f'{type(exc).__name__}:{exc}'[:500]
                  records.append(record)
                  print(json.dumps(record, ensure_ascii=False, sort_keys=True))

          summary = {
              'kind': 'non_qualification_claim_planner_benchmark',
              'git_sha': __import__('subprocess').check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'records': records,
          }
          Path('output/rq1c-planner-benchmark.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

      - name: Upload planner benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rq1c-planner-benchmark
          path: |
            output/rq1c-planner-benchmark.json
            output/model-sha256.txt
            output/llama-server-version.log
            output/llama-server.log
            output/llama-health.json
          if-no-files-found: warn
          retention-days: 7
