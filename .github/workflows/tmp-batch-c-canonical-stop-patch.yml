name: Temporary Batch C canonical stop patch

on:
  push:
    branches:
      - tmp/batch-c-canonical-stop-patch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 5 -r requirements.txt -r requirements-dev.txt
      - name: Apply narrow Batch C repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/application/active_research_runtime.py",
              'reason="model_call_attempts_exhausted",',
              'reason="claim_plan_unavailable",',
          )
          replace_once(
              "src/application/active_research_runtime.py",
              'reason=bootstrap.reason or "claim_plan_unavailable",',
              'reason="claim_plan_unavailable",',
          )
          replace_once(
              "tests/test_active_research_runtime.py",
              'assert failed.stop_reason == "model_call_attempts_exhausted"',
              'assert failed.stop_reason == "claim_plan_unavailable"',
          )
          replace_once(
              "tests/test_research_failure_state_matrix.py",
              '''    missing = sorted(\n        reason for reason in RESEARCH_STOP_REASONS if f'"{reason}"' not in writer_source\n    )''',
              '''    missing = sorted(\n        reason\n        for reason in RESEARCH_STOP_REASONS\n        if re.search(rf'''["']{re.escape(reason)}["']''', writer_source) is None\n    )''',
          )
          PY
      - name: Run focused contract tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_active_research_runtime.py::test_v1_planning_attempt_exhaustion_is_classified_before_third_call \
            tests/test_research_failure_state_matrix.py
          ruff check \
            src/application/active_research_runtime.py \
            tests/test_active_research_runtime.py \
            tests/test_research_failure_state_matrix.py
      - name: Commit generated patch on isolated branch
        shell: bash
        run: |
          rm .github/workflows/tmp-batch-c-canonical-stop-patch.yml
          git config user.name "2002yy"
          git config user.email "146716153+2002yy@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(research): project planning failures to canonical stop reason"
          git push origin HEAD:${GITHUB_REF_NAME}
