name: RQ1-C Hosted CPU Patch Runner

on:
  push:
    branches: [codex/rq1c-bounded-qualification]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'ci: add temporary rq1c hosted cpu patch runner' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/rq1c-bounded-qualification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply qualification-only patch
        run: python tools/_tmp_patch_rq1c_hosted_cpu_exemption.py
      - name: Focused qualification gate
        run: |
          python -m pytest -q tests/test_rq1c_bounded_qualification.py tests/test_active_research_runtime.py
          python -m ruff check tools/run_rq1c_bounded_qualification_core.py tools/evaluate_rq1c_bounded_qualification.py tests/test_rq1c_bounded_qualification.py
          python -m py_compile tools/run_rq1c_bounded_qualification_core.py tools/evaluate_rq1c_bounded_qualification.py
          git diff --check
      - name: Commit source-only qualification harness fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/run_rq1c_bounded_qualification_core.py tools/evaluate_rq1c_bounded_qualification.py tests/test_rq1c_bounded_qualification.py
          git commit -m 'test(qualification): exempt hosted cpu inference wallclock'
          git push origin HEAD:codex/rq1c-bounded-qualification
